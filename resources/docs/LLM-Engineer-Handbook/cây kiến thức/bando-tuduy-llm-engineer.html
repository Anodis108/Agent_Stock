# LLM Engineer Handbook — Bản Đồ Tư Duy Kiến Thức

## Giới Thiệu & Lộ Trình Kỹ Sư LLM
### Tổng quan Chương trình & Phương pháp Học
#### Mục tiêu & Cấu trúc 3 Module Chuyên sâu
##### Mục tiêu Đào tạo
- Trang bị toàn bộ kỹ năng thực chiến để xây dựng các hệ thống AI thực tế từ nền tảng đến production.
- Khả năng làm việc độc lập và xây dựng kiến trúc: API, local model, fine-tuning, RAG, Agent, và LLMOps.
##### Cấu trúc 3 Trụ Cột Tri thức
- Module I: LLM, Prompt, RAG & Vector DB — APIs, Local LLMs, Fine-tuning LoRA/QLoRA, Embeddings, Vector DBs, Advanced RAG, Agentic RAG, RAGAS Eval & Guardrails.
- Module II: AI Agent & Multi-Agent Systems — Agent Architecture, ReAct Loop, LangGraph StateGraph, Memory & Context Engineering, Tool Design, MCP, Multi-Agent Patterns.
- Module III: Production LLMOps — Prompt Management & Registry, Golden Dataset & Automated Eval Gates, Multi-tier Caching, vLLM / TGI GPU Serving, GCP/AWS Deployment, CI/CD, 3 Tầng Observability.
#### Phương pháp Học Thực chiến & 3 Dự án Capstone
##### Nguyên tắc Thiết kế
- Mỗi bài được thiết kế độc lập — có thể đọc theo thứ tự hoặc tra cứu trực tiếp bài cần.
- Kết hợp song song giữa lý thuyết kiến trúc và code thực hành chạy được ngay.
##### 3 Dự án Capstone Thực Tế
- Capstone 1: Trợ lý pháp lý tiếng Việt (Vietnamese Legal Assistant - CRAG + Guardrails).
- Capstone 2: Multi-Agent Vietnamese Research Assistant (Hệ thống nghiên cứu tự hành đa tác tử).
- Capstone 3: Production LLM Serving Pipeline (Khép kín từ CI/CD đến Observability).
#### Framework Tư Duy: Khi nào dùng gì?
##### Tiêu chí Lựa chọn Giải pháp
- Cần model hiểu ngữ cảnh từ tài liệu bên ngoài / nội bộ → Chọn RAG Pipeline.
- Dữ liệu phức tạp, cần suy luận nhiều bước (multi-hop) → Chọn Agentic RAG / AI Agent.
- Cần model tuân thủ format đặc thù, giọng điệu chuyên biệt, phong cách riêng → Chọn Fine-tuning.
- Cần kiểm soát tối đa chi phí, bảo mật nội bộ 100%, offline privacy → Chọn Local LLMs.

### Bài 1: LLM APIs Hands-on


#### 1. Chat Completions

##### Cấu trúc cơ bản

- Mọi LLM API (OpenAI, Anthropic, Gemini) đều xoay quanh một endpoint chính: **chat completions** — nhận vào danh sách messages, trả về message của assistant.
- Luồng hội thoại có cấu trúc vai trò rõ ràng: `system` (chỉ thị hành vi gốc), `user` (yêu cầu từ người dùng), và `assistant` (phản hồi của mô hình).
- Stateless API: Mỗi request độc lập hoàn toàn; để duy trì ngữ cảnh nhiều lượt (multi-turn), ứng dụng bắt buộc phải gửi lại toàn bộ lịch sử messages trong mỗi lần gọi.

##### Cấu trúc Messages
| Role | Mục đích |
| --- | --- |
| `system` | Thiết lập persona, quy tắc, ngữ cảnh cho toàn bộ cuộc hội thoại |
| `user` | Input từ người dùng |
| `assistant` | Phản hồi của model (dùng để xây dựng few-shot hoặc conversation history) |

#### 2. Parameters Quan Trọng

##### Temperature
- Kiểm soát mức độ ngẫu nhiên trong output.
| Giá trị | Hành vi | Dùng khi |
| --- | --- | --- |
| `0.0` | Deterministic, luôn chọn token có xác suất cao nhất | Code generation, fact extraction, structured output |
| `0.3–0.7` | Cân bằng giữa nhất quán và sáng tạo | Chatbot, summarization |
| `0.8–1.0` | Sáng tạo, đa dạng | Brainstorming, creative writing |
> **Lưu ý:** Temperature không ảnh hưởng đến "độ thông minh" — chỉ ảnh hưởng đến tính ngẫu nhiên. Model vẫn có thể sai dù temperature = 0.
##### max_tokens

- Giới hạn số lượng token tối đa trong phần phản hồi sinh ra của assistant, không ảnh hưởng đến số token của prompt đầu vào.
- Kiểm soát chi phí & an toàn: Ngăn ngừa mô hình lặp vô tận (infinite loop) và kiểm soát trần chi phí cho từng request trong production.
- Lưu ý quan trọng: Nếu đặt quá nhỏ, câu trả lời sẽ bị cắt đứt giữa chừng (với `finish_reason: length`); với structured output hoặc reasoning model, cần đặt đủ lớn để model hoàn thành JSON schema hoặc chain-of-thought.

##### top_p (Nucleus Sampling)
- Thay vì xét toàn bộ vocabulary, model chỉ chọn token từ **nhóm nhỏ nhất** có tổng xác suất tích lũy ≥ `top_p`.
| Giá trị | Hành vi |
| --- | --- |
| `1.0` | Xét toàn bộ phân phối (mặc định) |
| `0.9` | Cân bằng — loại bỏ các token đuôi xác suất thấp |
| `0.1–0.3` | Rất tập trung, gần như deterministic |
> **Không nên chỉnh đồng thời temperature và top_p.** Cả hai đều kiểm soát tính ngẫu nhiên theo cơ chế khác nhau. Khuyến nghị chỉ chỉnh **một** trong hai, giữ cái còn lại ở giá trị mặc định để tránh tương tác khó dự đoán.
##### Các parameters khác
| Parameter | Mô tả | Giá trị phổ biến |
| --- | --- | --- |
| `frequency_penalty` | Phạt token xuất hiện nhiều lần → giảm lặp | `0.0–1.0` |
| `presence_penalty` | Khuyến khích model đề cập chủ đề mới | `0.0–1.0` |
| `seed` | Cố định kết quả (hỗ trợ reproducibility) | Bất kỳ integer |

#### 3. Streaming

- Thay vì đợi toàn bộ response, streaming trả về token theo thời gian thực — trải nghiệm người dùng tốt hơn nhiều.
- **Khi nào dùng streaming:** Chat interfaces (hiển thị text ngay khi có), response dài (> 500 tokens), cần first-token latency thấp.

#### 4. Rate Limits & API Key Rotation

##### Rate Limit là gì?
- Mọi LLM provider đều giới hạn số lượng request để bảo vệ hạ tầng. Khi vượt ngưỡng, API trả về lỗi **HTTP 429 (Too Many Requests)**.
| Đơn vị giới hạn | Viết tắt | Ý nghĩa |
| --- | --- | --- |
| Requests per minute | **RPM** | Số lời gọi API tối đa mỗi phút |
| Tokens per minute | **TPM** | Tổng số token (input + output) mỗi phút |
| Requests per day | **RPD** | Số lời gọi tối đa mỗi ngày (thường ở tier thấp) |
> **Tier càng cao, limit càng lớn.** Provider thường nâng limit tự động theo lịch sử thanh toán (usage tier). Tài khoản mới luôn bắt đầu ở tier thấp với RPM/TPM khiêm tốn.
##### Xử lý 429: Exponential Backoff
- Khi gặp 429, **không** retry ngay lập tức — hãy đợi với thời gian tăng dần (kèm jitter để tránh nhiều client retry cùng lúc).
> **Tôn trọng header ****`Retry-After`****.** Nhiều provider trả về header `Retry-After` (số giây nên đợi) trong response 429. Ưu tiên dùng giá trị này thay vì tự tính backoff khi có.
##### API Key Rotation
- Khi cần throughput vượt limit của một key, có thể luân phiên (rotate) qua nhiều API key — mỗi key có hạn mức riêng.
- Rotation nâng cao — tự động loại key đang bị rate limit:
> **Bảo mật API key:** Luôn đọc key từ biến môi trường (`os.environ`) hoặc secrets manager, không hardcode. Không commit key lên git (thêm `.env` vào `.gitignore`). Rotation chỉ là giải pháp tạm thời — nếu cần throughput cao ổn định, hãy yêu cầu provider nâng tier hoặc dùng batch API.

#### 5. Prompt Patterns

##### Zero-shot Prompting
- Không cung cấp ví dụ — chỉ mô tả task.
- **Phù hợp khi:** Task đơn giản, rõ ràng; model đã được train trên task tương tự.
##### Few-shot Prompting
- Cung cấp 2–5 ví dụ (input → output) trước khi đưa ra câu hỏi thực.
- **Phù hợp khi:** Task có format output cụ thể; cần định hướng tone/style cho model.
> **Chọn examples tốt:** Examples nên đa dạng, bao phủ các edge case. Thứ tự examples ảnh hưởng đến kết quả — ví dụ gần nhất thường có trọng số cao hơn.
##### Chain-of-Thought (CoT)
- Yêu cầu model "suy nghĩ từng bước" trước khi đưa ra câu trả lời. Cải thiện đáng kể độ chính xác trên các task đòi hỏi lý luận.
- **Zero-shot CoT:**

##### Role Prompting

#### 6. Structured Outputs với Pydantic

##### Vấn đề

- LLM mặc định trả về text tự do không cấu trúc — dễ gãy vỡ khi tích hợp vào hệ thống phần mềm, khó parse và không đáng tin cậy về kiểu dữ liệu.
- Các giải pháp truyền thống như dùng Regex hoặc ép JSON bằng prompt thường xuyên gặp lỗi cú pháp (thiếu ngoặc nhọn, sai dấu phẩy, thừa markdown fence).
- Yêu cầu thực tế trong production: Cần cơ chế đảm bảo 100% output tuân thủ schema định trước, type-safe và có thể parse trực tiếp thành object của ngôn ngữ lập trình.

##### Cách tiếp cận với Pydantic + OpenAI

- Sử dụng phương thức `client.beta.chat.completions.parse()` với tham số `response_format=YourPydanticModel`.
- OpenAI tự động biên dịch class Pydantic thành JSON Schema chuẩn và gửi tới model với cờ `strict: true`.
- Kết quả trả về qua `completion.choices[0].message.parsed` là một object Pydantic hoàn chỉnh, hỗ trợ đầy đủ autocomplete, type hints và IDE validation.
- Cơ chế an toàn: Bắt lỗi `LengthFinishReasonError` nếu phản hồi bị cắt do chạm trần token hoặc `ValidationError` nếu có trường dữ liệu không khớp.

##### Pydantic Validators

- Tích hợp schema validation trực tiếp ở tầng model: Tự động kiểm tra tính hợp lệ của dữ liệu trước khi code ứng dụng xử lý tiếp.
- Định nghĩa ràng buộc trường qua `Field()`: Cung cấp `ge`, `le`, `min_length`, `description` giúp LLM hiểu chính xác miền giá trị hợp lệ của từng thuộc tính.
- Tùy biến validation logic bằng `@field_validator`: Tự động chuẩn hoá dữ liệu (chuẩn hoá chữ hoa/thường, kiểm tra định dạng email, số điện thoại, ngày tháng).

#### 7. Function Calling

##### Khái niệm

- Tối ưu hoá sản xuất: Đạt được sự cân bằng tối ưu giữa độ trễ phản hồi (latency), chi phí tính toán (cost) và độ chính xác của câu trả lời.
- Nguyên tắc cốt lõi: Yêu cầu rẻ nhất và nhanh nhất là yêu cầu không cần gọi đến mô hình LLM lớn — tận dụng tối đa các tầng cache và kỹ thuật định tuyến thông minh.
- Triển khai các chiến lược: Prompt Caching ở tầng provider, Semantic Caching ở tầng ứng dụng và Model Routing phân cấp tải.

##### Ví dụ: Tra thời tiết

- Định nghĩa danh sách công cụ trong tham số `tools`: Khai báo tên hàm `get_weather`, mô tả chi tiết chức năng và schema tham số JSON (`city: str`).
- Gửi request với `tool_choice="auto"`: Model phân tích câu hỏi người dùng; nếu cần tra cứu, nó trả về `tool_calls` chứa tên hàm và arguments JSON (`{"city": "Hà Nội"}`).
- Thực thi hàm thực tế ở backend và đóng gói kết quả dưới dạng message có `role: "tool"` kèm `tool_call_id` tương ứng.
- Gửi lại toàn bộ lịch sử kèm message tool cho model để model sinh câu trả lời giải thích tự nhiên, chính xác và đầy đủ ngữ cảnh cho người dùng.

##### Parallel Function Calling
- Model có thể gọi nhiều functions cùng lúc:
- **Ứng dụng phổ biến của Function Calling:** Tìm kiếm web/database; đặt lịch, gửi email, tạo ticket; tính toán/gọi API bên ngoài; xây dựng AI agents.

### Bài 2: Local LLMs


#### Phần A — Kiến trúc LLM

> Hiểu bên trong một Large Language Model: từ cơ chế Attention đến quy trình huấn luyện Pre-train và Post-train.
##### 1. Attention Mechanism
###### Vấn đề Attention giải quyết

- Trước cơ chế Attention, các kiến trúc tuần tự như RNN/LSTM xử lý token từng bước một — thông tin từ đầu câu bị suy hao dần khi chuỗi văn bản dài (vanishing gradient).
- Attention cho phép mỗi token nhìn trực tiếp đến bất kỳ vị trí nào khác trong chuỗi văn bản với độ phức tạp đường truyền là $O(1)$, bất kể khoảng cách.
- Nắm bắt trọn vẹn ngữ cảnh hai chiều và mối quan hệ ngữ nghĩa xa giữa các từ, tạo nền tảng cho sự bùng nổ của kiến trúc Transformer hiện đại.

###### Scaled Dot-Product Attention
- Mỗi token được biểu diễn bằng 3 vector:
| Vector | Ký hiệu | Ý nghĩa |
| --- | --- | --- |
| **Query** | Q | "Tôi đang tìm kiếm thông tin gì?" |
| **Key** | K | "Tôi chứa thông tin gì?" |
| **Value** | V | "Nội dung thực tế tôi mang theo" |
- **Giải thích từng bước:**
###### Multi-Head Attention
- Thay vì 1 Attention, dùng **H heads song song** — mỗi head học một loại quan hệ khác nhau.
> **Ví dụ với GPT-3:** GPT-3 dùng 96 attention heads, mỗi head có dimension 128 (tổng d_model = 12,288).
###### Causal (Masked) Attention
- Trong LLM, token chỉ được attend đến **các token trước nó** — không được "nhìn tương lai" khi generate.
- Thực hiện bằng cách mask phần trên của attention matrix:
> **Chi phí O(n²) của Attention:** Ma trận `Q·Kᵀ` có kích thước `n × n` (n = số token) → compute và bộ nhớ tăng **bình phương** theo độ dài sequence. Đây là lý do trực tiếp dẫn tới các kỹ thuật tối ưu inference như **KV-cache**, **FlashAttention** và **quantization**.
##### 2. Transformer Block
###### Kiến trúc tổng thể

- Một Transformer Decoder Block tiêu chuẩn (áp dụng trong GPT-4, Llama 3, Mistral, Qwen) gồm các lớp xếp chồng theo chuẩn Pre-LayerNorm hiện đại.
- Mỗi block gồm hai khối con cốt lõi: Khối Multi-Head Self-Attention (tính toán mối tương quan giữa các token) và khối Feed-Forward MLP (biến đổi phi tuyến không gian đặc trưng).
- Bao bọc quanh mỗi khối con là các đường kết nối tắt (Residual Skip Connections) và các lớp chuẩn hoá độc lập (LayerNorm hoặc RMSNorm).

###### Bên trong một Block

- Luồng xử lý Pre-LN tuần tự: `Input x → LayerNorm → Multi-Head Attention → Residual (+) → LayerNorm → Feed-Forward MLP → Residual (+) → Output`.
- RMSNorm / LayerNorm: Chuẩn hoá các giá trị kích hoạt theo chiều embedding độc lập với batch size, giữ phương sai gradient ổn định xuyên suốt hàng chục layers sâu.
- Residual Skip Connection: Cộng trực tiếp đầu vào $x$ với đầu ra của sub-layer ($x + \text{Sublayer}(x)$), giải quyết triệt để vấn đề mất mát gradient khi huấn luyện mạng sâu.
- Feed-Forward MLP (SwiGLU): Mở rộng không gian đặc trưng (thường tăng gấp 4 lần kích thước ẩn), đóng vai trò như bộ nhớ lưu trữ các sự kiện tri thức thế giới của mô hình.

###### Từng thành phần
- **Layer Normalization** — chuẩn hóa mỗi token embedding độc lập (không phụ thuộc batch size):
- Hai vị trí phổ biến: **Post-LN** (Transformer gốc, LayerNorm sau Attention/FFN) và **Pre-LN** (GPT-2 trở đi, LayerNorm trước — ổn định training hơn).
- **Feed-Forward Network (FFN)** — áp dụng trên từng token độc lập:
> **GELU vs SwiGLU:** Transformer gốc dùng GELU với 2 ma trận. Model hiện đại chuyển sang **SwiGLU** (gated, 3 ma trận) cho chất lượng tốt hơn — bù lại d_ff giảm xuống ~2/3 để giữ tổng param tương đương.
>
> **FFN là 'bộ nhớ' của model:** Nghiên cứu cho thấy FFN lưu trữ factual knowledge, trong khi Attention xử lý quan hệ ngữ cảnh.
- **Residual Connections:**
- Cho phép gradient chảy thẳng qua nhiều layer — giải quyết vanishing gradient khi có 32–96 blocks.
- **Positional Encoding** — Transformer không có khái niệm thứ tự tự nhiên, cần thêm vào:
| Loại | Ví dụ | Đặc điểm |
| --- | --- | --- |
| Absolute (learned) | GPT-2, BERT | Học vị trí, bị giới hạn bởi max_position |
| Absolute (sinusoidal) | Transformer gốc | Công thức toán học, extrapolate được |
| **RoPE** (Rotary) | Llama, Mistral | Encode relative position → phổ biến nhất hiện nay |
| ALiBi | MPT | Thêm bias vào attention scores |
###### Kích thước và Parameters
- Ước lượng cho model d_model = 4096, 32 layers, vocab ~128k (~ Llama 3 8B):
| Component | Parameters |
| --- | --- |
| Token embedding | 128000 × 4096 ≈ 0.5B |
| Mỗi Attention (Q+K+V+O, MHA thuần) | 4 × 4096² ≈ 67M |
| Mỗi FFN (SwiGLU, 3 Linear) | 3 × 4096 × 14336 ≈ 176M |
| **1 Block tổng** | **~240M** |
| 32 Blocks | ~7.5B |
| **Tổng model** | **~8B params** |
> **Grouped-Query Attention (GQA):** Công thức `4 × 4096²` ở trên chỉ đúng cho **Multi-Head Attention thuần**. Các model hiện đại (Llama 3, Qwen 2.5, Mistral) dùng **GQA** — nhiều query head **chia sẻ** chung một nhóm K/V head. Ví dụ Llama 3 8B có 32 query head nhưng chỉ 8 K/V head → K và V chỉ chiếm `2 × 4096 × 1024` thay vì `2 × 4096²`. Điều này giảm đáng kể kích thước **KV-cache** lúc inference, nên con số param thực tế của khối Attention nhỏ hơn ước lượng MHA.
##### 3. Pre-training
###### Mục tiêu

- Pre-training: Xây dựng nền tảng tri thức thế giới (world knowledge), khả năng hiểu ngôn ngữ và tư duy logic cơ bản từ kho dữ liệu văn bản khổng lồ.
- Huấn luyện mô hình từ con số 0 (from scratch) thông qua việc tối ưu hoá hàm mục tiêu tự giám sát (self-supervised learning) trên hàng nghìn tỷ tokens.
- Giai đoạn tốn kém tài nguyên nhất trong toàn bộ vòng đời LLM, đòi hỏi hàng nghìn cụm GPU tính toán liên tục trong nhiều tháng với chi phí hàng triệu đô la.

###### Objective: Next-Token Prediction
- Model học dự đoán token tiếp theo, tối thiểu hóa cross-entropy loss:
- Sau hàng tỷ ví dụ, model phải học: ngữ pháp và cú pháp; kiến thức thực tế (địa lý, lịch sử, khoa học); code, toán học, logic; nhiều ngôn ngữ đồng thời.
###### Dữ liệu Pre-training

- Nguồn dữ liệu hỗn hợp đa dạng: Web crawls (Common Crawl đã qua lọc), mã nguồn mở (GitHub), sách điện tử, bài báo khoa học (arXiv) và dữ liệu bách khoa (Wikipedia).
- Quy tắc vàng của AI hiện đại: Chất lượng dữ liệu quan trọng hơn số lượng dữ liệu (Data Quality > Data Quantity).
- Quy trình tinh lọc dữ liệu nghiêm ngặt: Lọc văn bản rác, khử trùng lặp (de-duplication qua MinHash/LSH), loại bỏ mã độc hại/PII và bổ sung dữ liệu tổng hợp (synthetic data) chất lượng cao.

##### 4. Post-training
###### Mục tiêu

- Pre-training: Xây dựng nền tảng tri thức thế giới (world knowledge), khả năng hiểu ngôn ngữ và tư duy logic cơ bản từ kho dữ liệu văn bản khổng lồ.
- Huấn luyện mô hình từ con số 0 (from scratch) thông qua việc tối ưu hoá hàm mục tiêu tự giám sát (self-supervised learning) trên hàng nghìn tỷ tokens.
- Giai đoạn tốn kém tài nguyên nhất trong toàn bộ vòng đời LLM, đòi hỏi hàng nghìn cụm GPU tính toán liên tục trong nhiều tháng với chi phí hàng triệu đô la.

###### Giai đoạn 1: Supervised Fine-tuning (SFT)
- Fine-tune model trên các cặp (instruction, response) chất lượng cao:
- **Nguồn dữ liệu SFT:** Human-written (chất lượng cao, đắt); Teacher model generated (GPT-4, Claude tạo → distillation); tập open-source: OpenAssistant, Dolly, ShareGPT.
###### Giai đoạn 2: RLHF / Preference Learning
- Mục tiêu: model không chỉ cần đúng mà còn cần **phù hợp với preference của người dùng** (helpful, honest, harmless).
- **Thách thức của RLHF:** Tốn kém (cần human raters); reward hacking; PPO phức tạp, không ổn định.
###### Giai đoạn 2 (alternative): DPO
- **Direct Preference Optimization** — không cần Reward Model riêng biệt, fine-tune trực tiếp từ preference pairs:
> **Trend hiện nay:** Hầu hết open-source models (Llama 3, Qwen 2.5, Mistral) dùng DPO hoặc biến thể (SimPO, IPO) thay vì RLHF truyền thống.
###### So sánh các bước Post-training

- SFT (Supervised Fine-tuning): Dạy mô hình hiểu cấu trúc hội thoại và tuân thủ mệnh lệnh (instruction-following) thông qua các cặp dữ liệu mẫu (prompt, response) do chuyên gia biên soạn.
- RLHF (Reinforcement Learning from Human Feedback): Huấn luyện Reward Model từ dữ liệu con người xếp hạng độ ưa thích, sau đó dùng thuật toán PPO tối ưu policy để mô hình vừa hữu ích vừa an toàn.
- DPO (Direct Preference Optimization): Giải pháp đột phá thay thế RLHF, bỏ qua Reward Model và PPO phức tạp, tối ưu toán học trực tiếp trên các cặp (chosen, rejected) preference; ổn định hơn, hội tụ nhanh và ít tốn VRAM.
- So sánh Base vs Instruct: Base Model chỉ tiếp tục sinh văn bản theo xác suất tự nhiên; Instruct Model hiểu system prompt, từ chối yêu cầu độc hại và trả lời đúng trọng tâm câu hỏi.

###### Tóm tắt: Base vs Instruct Model
|  | Base Model | Instruct/Chat Model |
| --- | --- | --- |
| **Hành vi** | Tiếp tục văn bản | Trả lời câu hỏi |
| **Ví dụ** | Llama-3-8B | Llama-3-8B-Instruct |
| **Dùng khi** | Fine-tune thêm, research | Production, end-user |
| **System prompt** | Không hiểu | Hiểu và tuân theo |
##### 5. Knowledge Distillation
###### Khái niệm

- Tối ưu hoá sản xuất: Đạt được sự cân bằng tối ưu giữa độ trễ phản hồi (latency), chi phí tính toán (cost) và độ chính xác của câu trả lời.
- Nguyên tắc cốt lõi: Yêu cầu rẻ nhất và nhanh nhất là yêu cầu không cần gọi đến mô hình LLM lớn — tận dụng tối đa các tầng cache và kỹ thuật định tuyến thông minh.
- Triển khai các chiến lược: Prompt Caching ở tầng provider, Semantic Caching ở tầng ứng dụng và Model Routing phân cấp tải.

###### Các phương pháp

- Sequence-level Distillation: Cho mô hình Teacher sinh hàng triệu câu trả lời chất lượng cao cho một tập prompt lớn, sau đó dùng tập dữ liệu này để fine-tune mô hình Student.
- Logit Distillation: Huấn luyện Student khớp trực tiếp phân phối xác suất mềm (soft probability distribution / temperature logits) của Teacher ở từng token, giúp Student học được cả độ tự tin và mối quan hệ ngầm giữa các từ.
- Feature-based Distillation: Ép các vector biểu diễn ẩn (hidden states) ở các layer trung gian của Student khớp với không gian biểu diễn tương ứng của Teacher.

###### So sánh các kỹ thuật thu nhỏ model
| Phương pháp | Cơ chế | Kết quả |
| --- | --- | --- |
| **Distillation** | Train lại model nhỏ hơn | Model nhỏ hơn, architecture khác |
| **Quantization** | Giảm precision của weights | Model nhỏ hơn, cùng architecture |
| **Pruning** | Xóa weights không quan trọng | Model thưa, cùng architecture |
> **Distillation (train) vs Quantization (deploy):** Distillation tạo ra model mới ở giai đoạn **training** - gần với Pre-train/Post-train. Quantization là kỹ thuật áp dụng lúc **deploy** model có sẵn.
##### Tóm tắt kiến trúc
| Giai đoạn | Mục tiêu | Chi phí | Kết quả |
| --- | --- | --- | --- |
| **Pre-training** | World knowledge | Hàng triệu USD | Base model |
| **SFT** | Instruction following | Hàng nghìn USD | Biết trả lời đúng format |
| **RLHF / DPO** | Alignment | Vài nghìn USD | Helpful + Harmless |

### Bài 3: Fine-tuning với LoRA/QLoRA

- Fine-tuning điều chỉnh weights của model pre-trained để tối ưu cho task cụ thể. Bài này gồm framework quyết định khi nào nên fine-tune, các phương pháp PEFT, và thực hành fine-tune Llama với TRL.

#### 1. Decision Framework: Prompt vs RAG vs Fine-tuning

- Đây là câu hỏi quan trọng nhất trước khi đầu tư vào fine-tuning.
##### So sánh chi tiết
|  | Prompt Engineering | RAG | Fine-tuning |
| --- | --- | --- | --- |
| **Chi phí setup** | Thấp | Trung bình | Cao |
| **Cần training data** | Không | Không | Có (≥ 100–1000 samples) |
| **Kiến thức mới** | Không (knowledge cutoff) | ✅ Có (real-time) | Tích hợp vào weights |
| **Thay đổi hành vi** | Hạn chế | Không | ✅ Sâu, nhất quán |
| **Latency** | Thấp | Trung bình (retrieval) | Thấp |
| **Chi phí inference** | Cao (long context) | Trung bình | Thấp |
##### Khi nào nên Fine-tune?
- ✅ **Nên fine-tune khi:** Cần format output rất cụ thể mà prompting không đạt được nhất quán; domain-specific style (giọng văn pháp lý, y tế); cần giảm latency và chi phí (context ngắn hơn); cần model hoạt động tốt không có internet (embedded); có task lặp lại hàng triệu lần → tiết kiệm chi phí.
- ❌ **Không nên fine-tune khi:** Vấn đề có thể giải quyết bằng better prompting; cần thông tin cập nhật liên tục (dùng RAG); không có đủ labeled data chất lượng cao; đang proof-of-concept.

#### 2. Full Fine-tuning vs PEFT

##### Full Fine-tuning
- Update **toàn bộ** parameters của model.
- **Vấn đề:** Llama 3 8B (~8B params × 2 bytes FP16) = **16 GB** chỉ cho weights; optimizer states (AdamW) chiếm thêm 2× weights = **+32 GB**; gradient checkpointing **+8 GB** → tổng **~56 GB VRAM** — cần nhiều A100 80GB.
##### PEFT (Parameter-Efficient Fine-Tuning)
- Chỉ train **một phần nhỏ** parameters mới được thêm vào, giữ nguyên weights gốc.
| Phương pháp | % Params Trainable | Memory | Chất lượng |
| --- | --- | --- | --- |
| Full FT | 100% | ~56 GB (8B) | Tốt nhất |
| LoRA | ~0.5–2% | ~6–12 GB | Gần bằng Full FT |
| QLoRA | ~0.5–2% | ~4–6 GB | Tốt (nhỏ hơn LoRA) |
| Prompt Tuning | <0.01% | Rất thấp | Thấp hơn |

#### 3. LoRA - Low-Rank Adaptation

##### Nguyên lý
- LoRA giả định rằng "knowledge updates" trong fine-tuning có rank thấp — tức là có thể biểu diễn bằng tích hai ma trận nhỏ.
- Với `r = 8` và `d = 4096` (Llama 7B):
##### Hyperparameters LoRA
| Parameter | Ý nghĩa | Giá trị thường dùng |
| --- | --- | --- |
| `r` (rank) | Rank của ma trận decomposition - cao hơn = nhiều params hơn | 8, 16, 32, 64 |
| `lora_alpha` | Scaling factor — ảnh hưởng learning rate hiệu quả | Thường = r hoặc 2×r |
| `lora_dropout` | Dropout để tránh overfitting | 0.05–0.1 |
| `target_modules` | Modules nào được áp dụng LoRA | `q_proj, v_proj` (tối thiểu) hoặc tất cả attention |
- **Chọn r như thế nào:** `r=8` (task đơn giản, ít data); `r=16` (balanced, phổ biến nhất); `r=32–64` (task phức tạp, nhiều data; cần nhiều VRAM hơn).

#### 4. QLoRA - Quantized LoRA

- Đột phá công nghệ giúp giảm 70% bộ nhớ VRAM: Cho phép fine-tune mô hình 70 tỷ tham số trên một GPU 48GB duy nhất, hoặc mô hình 8B trên GPU tiêu dùng 16GB/24GB.
- Ba cải tiến cốt lõi: (1) Nén trọng số base model xuống dạng số 4-bit NormalFloat (NF4) tối ưu cho phân phối chuẩn, (2) Double Quantization để lượng tử hoá cả các hằng số lượng tử, (3) Paged Optimizers chống tràn bộ nhớ VRAM khi gặp sequence dài.
- Cơ chế huấn luyện: Giữ nguyên base model đóng băng ở 4-bit, chỉ kích hoạt và tính toán gradient cho các ma trận thích ứng LoRA ở độ chính xác 16-bit (BF16/FP16).

#### 5. Fine-tuning Llama 3.2 3B với TRL SFTTrainer

##### Chuẩn bị Data — Alpaca format

- Cấu trúc 3 trường chuẩn: `instruction` (nhiệm vụ/câu lệnh), `input` (dữ liệu ngữ cảnh đi kèm, để trống nếu không có), và `output` (câu trả lời mẫu mong muốn của chuyên gia).
- Áp dụng Chat Template: Kết hợp các trường thành chuỗi prompt hoàn chỉnh tuân thủ định dạng đặc thù của base model (ví dụ template của Llama 3 hoặc ChatML) trước khi đưa vào tokenizer.
- Tiêu chuẩn chất lượng: Tập trung xây dựng 1,000–5,000 mẫu dữ liệu sạch, phong phú về miền tri thức, phản ánh đúng văn phong tiếng Việt tự nhiên và không chứa lỗi định dạng.

##### Full Training Script

- Pipeline 5 bước hoàn chỉnh sử dụng hệ sinh thái Hugging Face `transformers`, `peft` và `trl`:
- 1. Load Tokenizer: Cấu hình `pad_token = eos_token` và đồng bộ padding side phù hợp cho sinh văn bản.
- 2. Load Base Model: Sử dụng `BitsAndBytesConfig` với `load_in_4bit=True`, `bnb_4bit_quant_type="nf4"`, `bnb_4bit_compute_dtype=torch.bfloat16`.
- 3. Cấu hình LoRA Adapter: Thiết lập `LoraConfig(r=16, lora_alpha=32, target_modules=["q_proj", "k_proj", "v_proj", "o_proj"], lora_dropout=0.05)`.
- 4. Cấu hình Huấn luyện: Khởi tạo `SFTConfig` với learning rate `2e-4`, optimizer `paged_adamw_8bit`, lr_scheduler `cosine`, gradient accumulation.
- 5. Huấn luyện & Lưu trữ: Chạy `trainer = SFTTrainer(...)`, gọi `trainer.train()` và lưu adapter ra đĩa bằng `trainer.save_model()`.

#### 6. Merge Adapter & Push lên HF Hub

##### Merge LoRA adapter vào base model

- Tải lại base model ở độ chính xác đầy đủ 16-bit (FP16 hoặc BF16) trên CPU/GPU để bảo toàn chất lượng ma trận trọng số.
- Gắn adapter đã huấn luyện vào mô hình gốc thông qua `PeftModel.from_pretrained(base_model, adapter_dir)`.
- Hợp nhất vĩnh viễn bằng lệnh `model = model.merge_and_unload()`: Cộng trực tiếp các ma trận rank thấp vào trọng số gốc $W = W_0 + \frac{\alpha}{r}(A \times B)$.
- Lợi ích: Xuất xưởng một checkpoint mô hình độc lập, không còn phụ thuộc thư viện PEFT lúc inference, tương thích trực tiếp với vLLM, TGI, Ollama và llama.cpp.

##### Push lên Hugging Face Hub

- Xác thực quyền truy cập: Sử dụng `huggingface_hub.login(token)` với Write Token từ tài khoản tổ chức hoặc cá nhân.
- Đặt định danh repository chuẩn hóa theo cú pháp `username/model-name` đi kèm phiên bản rõ ràng.
- Đẩy toàn bộ trọng số safetensors, cấu hình tokenizer và generation config lên Hub bằng phương thức `.push_to_hub()`, sẵn sàng cho cộng đồng hoặc pipeline deployment kéo về.

##### Model Card tự động

- Tự động tạo file `README.md` chuẩn mực trên Hugging Face Hub chứa bộ metadata tags (pipeline_tag, ngôn ngữ: vi, license, base_model).
- Cung cấp thông tin chi tiết về quá trình huấn luyện: Tập dataset sử dụng, các siêu tham số (learning rate, LoRA rank/alpha, batch size, số epochs).
- Hướng dẫn sử dụng nhanh (Quickstart Usage): Cung cấp sẵn đoạn code mẫu nạp mô hình qua pipeline `transformers` để người dùng kiểm thử tức thì.

| Khái niệm | Key Points |
| --- | --- |
| **Decision Framework** | Thử Prompt → RAG → Fine-tune theo thứ tự chi phí tăng dần |
| **LoRA** | Thêm 2 ma trận nhỏ (A, B) cho mỗi weight; chỉ train A và B |
| **QLoRA** | LoRA + 4-bit quantization → train 8B model trên GPU 24GB |
| **r (rank)** | Cao hơn = nhiều params hơn = chất lượng cao hơn = chậm hơn |
| **lora_alpha** | Thường = 2×r; ảnh hưởng đến tốc độ học |
| **Merge** | `merge_and_unload()` → single model không cần PEFT khi inference |
> **Pitfalls phổ biến:**
> 1. **Catastrophic forgetting** — fine-tune quá nhiều epoch → model quên kiến thức gốc → dùng `r` nhỏ hơn hoặc epoch ít hơn.
> 2. **Data quality > quantity** — 500 examples chất lượng cao tốt hơn 5000 examples kém.
> 3. **Learning rate quá cao** — 2e-4 là điểm khởi đầu tốt; quá cao sẽ phá vỡ model.

### Bài 4: Embeddings & Vector Databases

- Embeddings chuyển đổi text thành vector số để có thể tính toán semantic similarity. Vector databases lưu trữ và tìm kiếm hàng triệu vectors hiệu quả. Đây là nền tảng kỹ thuật của RAG.

#### 1. Embeddings

##### Khái niệm

- Tối ưu hoá sản xuất: Đạt được sự cân bằng tối ưu giữa độ trễ phản hồi (latency), chi phí tính toán (cost) và độ chính xác của câu trả lời.
- Nguyên tắc cốt lõi: Yêu cầu rẻ nhất và nhanh nhất là yêu cầu không cần gọi đến mô hình LLM lớn — tận dụng tối đa các tầng cache và kỹ thuật định tuyến thông minh.
- Triển khai các chiến lược: Prompt Caching ở tầng provider, Semantic Caching ở tầng ứng dụng và Model Routing phân cấp tải.

##### Sentence-transformers

- Thư viện Python chuẩn mực để tạo embedding cho câu và đoạn văn bản, hoạt động trên nền PyTorch và Hugging Face.
- Mô hình đa ngôn ngữ hàng đầu cho tiếng Việt: `intfloat/multilingual-e5-large` (1024 chiều) và `BAAI/bge-m3` (hỗ trợ cả dense vector, sparse vector và ColBERT multi-vector).
- Quy tắc tiền tố E5: Bắt buộc thêm tiền tố `"passage: "` cho văn bản lưu trữ và `"query: "` cho câu hỏi tìm kiếm để mô hình tối ưu không gian biểu diễn bất đối xứng.

##### OpenAI Embeddings

- Dịch vụ embedding thương mại chất lượng cao truy cập qua API: `text-embedding-3-small` (1536 chiều, rẻ, nhanh) và `text-embedding-3-large` (3072 chiều, độ chính xác ngữ nghĩa tối đa).
- Công nghệ Matryoshka Representation Learning: Cho phép cắt ngắn vector xuống các kích thước nhỏ hơn (ví dụ 512 hoặc 256 chiều qua tham số `dimensions`) mà vẫn bảo toàn phần lớn độ chính xác.
- Giúp tiết kiệm đến 70% chi phí lưu trữ RAM và tăng tốc độ tìm kiếm vector trong các ứng dụng quy mô lớn.

#### 2. Similarity Metrics

##### Cosine Similarity
- Đo góc giữa 2 vectors — không phụ thuộc vào magnitude (độ dài vector).
- **Dùng khi:** Embedding không được normalize theo magnitude — muốn so sánh hướng, không phải độ lớn.
##### Dot Product

- Công thức tích vô hướng: Tổng tích các phần tử tương ứng của hai vector $\sum (u_i \times v_i)$.
- Dùng khi: Các vector đã được chuẩn hoá L2 (độ dài bằng 1) — khi đó Dot Product tương đương hoàn toàn với Cosine Similarity.
- Tối ưu hiệu năng: Phép tính Dot Product không cần chia căn bậc hai độ dài ma trận, cho phép tăng tốc độ tính toán phần cứng lên 2–3 lần trên CPU/GPU hiện đại.

##### Euclidean Distance
- **Dùng khi:** Magnitude quan trọng; ít dùng trong NLP hơn cosine/dot.
| Metric | Khi nào dùng | Lưu ý |
| --- | --- | --- |
| Cosine | Default choice cho text | Normalize trước nếu chưa normalize |
| Dot Product | Vectors đã L2-normalized | Nhanh nhất |
| Euclidean | Khi magnitude có ý nghĩa | Ít dùng cho NLP |

#### 3. Approximate Nearest Neighbor (ANN)

##### Vấn đề với Exact Search

- Tìm kiếm chính xác (Brute-force kNN): Quét tuần tự và so sánh câu hỏi với từng vector trong toàn bộ cơ sở dữ liệu.
- Giới hạn hiệu năng: Với 1 triệu vectors 1024 chiều, brute-force mất hàng trăm mili-giây đến vài giây cho mỗi query — hoàn toàn không thể đáp ứng yêu cầu realtime trong production.
- Giải pháp ANN (Approximate Nearest Neighbors): Chấp nhận đánh đổi một phần rất nhỏ độ chính xác (1–2%) để đạt tốc độ tìm kiếm dưới 10 mili-giây thông qua cấu trúc chỉ mục đồ thị (HNSW) hoặc phân cụm (IVF).

##### HNSW - Hierarchical Navigable Small World
- HNSW xây dựng đồ thị phân cấp: lớp trên ít nodes (highway), lớp dưới nhiều nodes (local roads).
- **Đặc điểm HNSW:** Rất nhanh (sub-millisecond với hàng triệu vectors); RAM-based → cần load vào memory; phù hợp Chroma, Qdrant, Weaviate.
##### IVF - Inverted File Index
- Chia vectors thành các **clusters** (Voronoi cells). Khi tìm kiếm, chỉ search trong `nprobe` clusters gần nhất.
- **Đặc điểm IVF:** Disk-friendly — phù hợp dataset rất lớn (billions of vectors); cần tune `nlist` (số clusters) và `nprobe`; phù hợp FAISS, pgvector.

#### 4. Vector Databases

##### So sánh tổng quan
| DB | Index | Deployment | Ưu điểm | Nhược điểm |
| --- | --- | --- | --- | --- |
| **Chroma** | HNSW | Local/Docker | Đơn giản nhất, tốt cho dev | Không scale tốt |
| **FAISS** | HNSW/IVF | In-memory/Library | Meta-backed, cực nhanh | Không UI, không persist tự động |
| **Qdrant** | HNSW | Local/Cloud | Filtering mạnh, Rust backend | Setup phức tạp hơn Chroma |
| **Pinecone** | Managed | Cloud only | Serverless, zero ops | Phí cao, vendor lock-in |
| **pgvector** | HNSW/IVF | PostgreSQL | Tích hợp SQL, ACID | Chậm hơn specialized DBs |
##### Chroma - Quickstart

- Cơ sở dữ liệu vector dạng nhúng (embedded vector DB), hoạt động không cần server rời, lưu trực tiếp dữ liệu vào thư mục cục bộ qua `chromadb.PersistentClient(path="./chroma_db")`.
- Tạo collection linh hoạt với tuỳ chọn khoảng cách metric: Cosine (`hnsw:space: "cosine"`), Euclidean L2 hoặc Inner Product.
- Thêm tài liệu đa thành phần: Lưu trữ đồng thời `ids`, `embeddings`, raw `documents` (text), và dictionary `metadatas` cho từng chunk văn bản.
- Tìm kiếm ngữ nghĩa tức thì: Gọi `collection.query(query_embeddings, n_results=5)` tự động trả về văn bản phù hợp, điểm số khoảng cách và siêu dữ liệu đi kèm.

##### FAISS - Hiệu năng cao

- Thư viện C++ chuyên dụng kèm Python wrapper do Meta AI phát triển, tối ưu hoá tối đa cho tìm kiếm vector siêu tốc trên RAM lớn và cụm GPU.
- Chỉ mục `IndexFlatIP`: Tìm kiếm tích vô hướng chính xác 100%, đóng vai trò như thước đo Cosine chuẩn khi các vector đã được chuẩn hoá L2.
- Hỗ trợ tuần tự hoá lưu index ra file nhị phân (`faiss.write_index`) và đọc lại vào bộ nhớ tức thì (`faiss.read_index`).
- Lưu ý thực tế: FAISS không quản lý metadata phong phú; lập trình viên cần xây dựng bảng lookup bên ngoài để ánh xạ từ vector index ID sang nội dung văn bản gốc.

##### Qdrant - Production-ready

- Vector database chuyên dụng viết bằng Rust, thiết kế cho môi trường production quy mô lớn, hỗ trợ phân tán, độ trễ cực thấp và lưu trữ kết hợp RAM/Disk (mmap).
- Cấu trúc dữ liệu Points: Mỗi điểm gồm `id`, `vector`, và `payload` (JSON chứa metadata tùy biến không giới hạn kiểu dữ liệu).
- Khả năng lọc payload vượt trội: Kết hợp điều kiện lọc kinh doanh (thời gian, quyền truy cập, danh mục) song song với quá trình duyệt đồ thị HNSW mà không làm giảm tốc độ tìm kiếm.

##### pgvector - SQL Integration

- Tiện ích mở rộng biến hệ quản trị cơ sở dữ liệu PostgreSQL thành một vector database thực thụ, lưu vector trong cột kiểu dữ liệu `vector(dimensions)`.
- Hỗ trợ chỉ mục HNSW tốc độ cao: `CREATE INDEX ON table USING hnsw (embedding vector_cosine_ops)` cho phép tìm kiếm xấp xỉ trên bảng dữ liệu hàng triệu dòng.
- Toán tử khoảng cách chuyên biệt: `<=>` (Cosine distance), `<->` (Euclidean L2), và `<#>` (Negative Inner Product).
- Ưu điểm chiến lược: Hợp nhất toàn bộ dữ liệu quan hệ, phân quyền, giao dịch ACID và tìm kiếm vector trong một hệ thống duy nhất; truy vấn dễ dàng qua các lệnh SQL JOIN truyền thống.

#### Tóm tắt: Chọn Vector DB cho dự án

| Tình huống | Khuyến nghị |
| --- | --- |
| Prototype nhanh | Chroma |
| Production self-hosted | Qdrant |
| Đã có PostgreSQL stack | pgvector |
| Cần scale tự động | Pinecone |
| Tiếng Việt, open-source embedding | `BAAI/bge-m3` hoặc `multilingual-e5-large` |

### Bài 5: RAG Pipeline

- RAG (Retrieval-Augmented Generation) giải quyết giới hạn context window của LLM bằng cách **tìm kiếm thông tin liên quan rồi đưa vào prompt** — thay vì nhồi toàn bộ tài liệu.

#### 1. Kiến trúc Tổng quan RAG

- Pha Ingestion (Chạy một lần / định kỳ): Tài liệu thô (PDF, DOCX, Web) → Trích xuất văn bản (Loaders) → Phân đoạn (Chunking) → Nhúng vector (Embedding) → Lưu trữ vào Vector Database kèm Metadata.
- Pha Inference (Chạy realtime trên mỗi câu hỏi): Câu hỏi người dùng → Embed thành vector → Truy xuất các chunk liên quan nhất từ Vector DB → Ghép vào Augmented Prompt → Đưa vào LLM → Trả lời kèm trích dẫn nguồn.
- Phân định trách nhiệm: Vector DB chịu trách nhiệm tìm đúng và đủ thông tin thực tế; LLM chịu trách nhiệm suy luận logic và hành văn chính xác dựa trên ngữ cảnh được cung cấp.

#### 2. Ingestion Pipeline

##### Document Loading

- Chuyển đổi các định dạng tài liệu không đồng nhất (PDF, Word, HTML, Markdown) thành danh sách các Document objects chuẩn hoá.
- Cấu trúc của Document object gồm 2 thành phần cốt lõi: `page_content` (chuỗi văn bản trích xuất) và `metadata` (dictionary chứa source, page, author, timestamp).
- Bộ công cụ phổ biến: `PyPDFLoader` (đọc file PDF đơn giản), `PyPDFDirectoryLoader` (quét toàn bộ thư mục), `Docx2txtLoader` (xử lý file Word), và `Unstructured` (xử lý đa định dạng phức tạp kèm bảng biểu).

##### Chunking Strategies
- **Fixed-size Chunking:**
- **Ưu điểm:** Đơn giản, dự đoán được **Nhược điểm:** Có thể cắt giữa câu/đoạn
- **Semantic Chunking:**
- **Ưu điểm:** Chunks có nghĩa hoàn chỉnh hơn **Nhược điểm:** Chậm hơn, chi phí embedding cao hơn
- **Markdown / Structure-aware:**
##### Metadata Enrichment

- Bổ sung thông tin ngữ cảnh có cấu trúc vào từng chunk trước khi lưu vào DB: Số hiệu văn bản, số trang, tên chương mục, ngày ban hành, tác giả, và đoạn tóm tắt nội dung.
- Tối ưu hoá truy xuất: Cho phép hệ thống thực hiện Metadata Filtering (lọc trước phạm vi ngày tháng hoặc loại văn bản) trước khi tính toán vector, giảm 90% không gian tìm kiếm.
- Tạo nền tảng vững chắc cho tính năng trích dẫn nguồn (citation) chính xác đến từng trang sách hoặc điều khoản luật cụ thể.

##### Indexing

- Quá trình tổ chức và lưu trữ các vector embedding vào cấu trúc dữ liệu tối ưu cho việc tìm kiếm láng giềng gần nhất (ANN).
- Chỉ mục HNSW (Hierarchical Navigable Small World): Xây dựng đồ thị phân tầng nhiều lớp, cân bằng giữa tốc độ tìm kiếm cực nhanh và độ chính xác cao.
- Các siêu tham số cốt lõi: `M` (số lượng liên kết tối đa của mỗi node) và `ef_construction` (độ sâu tìm kiếm khi xây dựng đồ thị) — giá trị càng lớn thì index càng chính xác nhưng tốn thêm RAM và thời gian build.

#### 3. Retrieval

##### Basic Semantic Search

- Ánh xạ câu hỏi của người dùng thành vector embedding thông qua cùng một mô hình embedding đã dùng khi lập chỉ mục tài liệu.
- Tính toán độ tương đồng Cosine giữa vector truy vấn và toàn bộ vector trong cơ sở dữ liệu để chọn ra top-k chunks có điểm số cao nhất.
- Khả năng hiểu ngữ nghĩa: Tìm được tài liệu có cùng ý tưởng ngay cả khi người dùng sử dụng từ ngữ, tiếng lóng hoặc từ đồng nghĩa hoàn toàn khác với từ trong văn bản.

##### Query Rewriting

- Kỹ thuật tiền xử lý sử dụng LLM để viết lại câu hỏi gốc của người dùng trước khi gửi vào Vector Database.
- Giải quyết các vấn đề phổ biến trong hội thoại: Mở rộng các câu hỏi quá ngắn, giải quyết các đại từ mơ hồ ("cái này", "nó", "ông ấy"), và bổ sung từ khoá chuyên ngành liên quan.
- Nâng cao tỷ lệ tìm trúng tài liệu hữu ích (Retrieval Recall) lên từ 20% đến 40% so với việc tìm kiếm trực tiếp bằng câu hỏi thô.

##### Hybrid Search
- **Khi nào dùng Hybrid Search:**
- Documents chứa nhiều proper nouns, số liệu, mã điều luật
- Queries ngắn, keyword-based
- Cần cả precision (keyword) và recall (semantic)
##### Re-ranking

- Kỹ thuật xếp hạng lại tài liệu sử dụng mô hình Cross-Encoder (như `bge-reranker-large` hoặc Cohere Rerank) sau bước tìm kiếm vector ban đầu.
- Cơ chế Cross-Encoder: Nhận đồng thời cặp `(Query, Chunk)` vào mạng transformer để tính toán self-attention toàn diện giữa từng từ của câu hỏi và tài liệu, cho độ chính xác vượt trội hơn Bi-Encoder.
- Kiến trúc chuẩn 2 tầng (Two-stage Retrieval): Tầng 1 dùng Bi-Encoder quét nhanh top 50–100 ứng viên từ Vector DB; Tầng 2 dùng Cross-Encoder lọc lấy top 3–5 chunks chất lượng nhất đưa vào ngữ cảnh LLM.

#### 4. Generation

##### Grounding - Bám sát tài liệu

- Kỹ thuật kiểm soát prompt nghiêm ngặt nhằm buộc mô hình chỉ được phép trả lời dựa trên những thông tin có mặt trong ngữ cảnh được cung cấp.
- Quy tắc ứng xử không khoan nhượng: Nếu ngữ cảnh không chứa đủ thông tin để trả lời, mô hình bắt buộc phải nói rõ "Tài liệu được cung cấp không đề cập đến vấn đề này", tuyệt đối không được tự suy diễn hoặc bịa đặt (hallucination).
- Đặc biệt tối quan trọng trong các lĩnh vực yêu cầu tính chính xác tuyệt đối như y tế, tài chính, pháp lý và kỹ thuật công nghiệp.

##### Citations

- Yêu cầu mô hình đính kèm nguồn trích dẫn cụ thể sau mỗi luận điểm hoặc câu khẳng định trong phản hồi (ví dụ: `[Nguồn: Luật Doanh nghiệp 2020, Điều 14, Trang 23]`).
- Tăng cường độ tin cậy và tính minh bạch: Cho phép người dùng hoặc chuyên gia kiểm tra chéo và xác minh tính xác thực của thông tin tức thì chỉ bằng một cú nhấp chuột.
- Giảm thiểu rủi ro pháp lý và trách nhiệm nghiệp vụ cho các ứng dụng AI doanh nghiệp.

#### 5. Full RAG Pipeline - Chat với Vietnamese PDFs

- Tích hợp toàn diện pipeline RAG hoàn chỉnh cho tài liệu tiếng Việt:
- 1. Document Loading: Nạp toàn bộ văn bản PDF qua `PyPDFDirectoryLoader`.
- 2. Smart Chunking: Dùng `RecursiveCharacterTextSplitter` với kích thước 512 ký tự và độ gối đầu (overlap) 64 ký tự để giữ nguyên tính liền mạch ngữ nghĩa.
- 3. Embedding & Store: Nhúng vector bằng `multilingual-e5-large` và lưu trữ bền vững vào Chroma hoặc Qdrant.
- 4. LCEL Generation Chain: Kết hợp Retriever, ChatPromptTemplate tuân thủ grounding nghiêm ngặt, mô hình ChatOpenAI và StrOutputParser để trả lời câu hỏi mượt mà kèm trích dẫn.

#### Tóm tắt: Các quyết định quan trọng

| Bước | Lựa chọn | Khuyến nghị |
| --- | --- | --- |
| **Loader** | PyPDF, Unstructured, LlamaParse | PyPDF cho PDF đơn giản; LlamaParse cho PDF phức tạp |
| **Chunk size** | 256–1024 chars | 512 chars + 64 overlap là điểm khởi đầu tốt |
| **Embedding** | OpenAI / BGE-M3 / multilingual-e5 | BGE-M3 cho tiếng Việt self-hosted |
| **Retrieval** | Semantic / Hybrid | Hybrid khi có proper nouns / mã số |
| **Re-ranking** | Cross-encoder | Thêm vào khi precision không đủ |
| **top_k** | 3–10 | Bắt đầu với 5; tăng nếu cần nhiều context hơn |
> **Debugging RAG** — Khi RAG không hoạt động tốt, debug theo thứ tự:
> 1. **Retrieval** — retrieved chunks có relevant không? (`retriever.invoke(query)`)
> 2. **Chunking** — chunk có đủ context không? Thử tăng `chunk_size`
> 3. **Embedding model** — thử model khác, check similarity scores
> 4. **Prompt** — model có bị "lạc lối" không? Thêm constraint rõ hơn

### Bài 6: Agentic RAG

- RAG truyền thống là pipeline cố định: luôn retrieve → generate. **Agentic RAG** thêm vào khả năng *quyết định*: có cần retrieve không? Retrieved chunks có đủ tốt không? Câu trả lời có đủ tin cậy không?

#### 1. Giới hạn của RAG Truyền thống

| Vấn đề | Mô tả | Ví dụ |
| --- | --- | --- |
| **Always retrieves** | Retrieve ngay cả khi không cần | "2 + 2 = ?" vẫn search vector DB |
| **No quality check** | Không kiểm tra chunks có relevant không | Trả về nonsense nếu không có thông tin |
| **Single-hop** | Không thể chain nhiều retrieval steps | Câu hỏi cần info từ 2 tài liệu khác nhau |
| **No fallback** | Không có plan B khi không tìm được | Hallucinate thay vì từ chối |

#### 2. Self-RAG

- Self-RAG thêm **reflection tokens** vào quá trình generation — model tự đánh giá ở mỗi bước.
##### Ba loại Reflection
- **Retrieve necessity** — Có cần retrieve không?
- **Chunk relevance** — Chunk có liên quan không?
- **Answer faithfulness** — Câu trả lời có dựa trên tài liệu không?

#### 3. Corrective RAG (CRAG)

- CRAG là phiên bản practical hơn của Self-RAG với **grading + fallback to web search**.
##### Implementation với LangGraph

- Xây dựng luồng Agentic RAG dưới dạng đồ thị có trạng thái (`StateGraph`), vượt qua giới hạn của các pipeline tuyến tính cứng nhắc.
- Khai báo State: Quản lý tập trung câu hỏi người dùng (`question`), danh sách chunks (`documents`), số lần thử lại (`retry_count`), và câu trả lời (`generation`).
- Các Node thành phần: Node Retrieve (tìm kiếm vector), Node Grade Documents (đánh giá mức độ liên quan của tài liệu), Node Generate (sinh câu trả lời), Node Rewrite Query (viết lại câu hỏi).
- Conditional Edges: Định tuyến luồng dựa trên chất lượng tài liệu — nếu tài liệu đủ tốt thì chuyển sang Generate; nếu tài liệu rác thì rẽ nhánh sang Rewrite Query để tìm kiếm lại.

#### 4. Query Decomposition & Multi-hop

- Phân rã câu hỏi phức tạp (Query Decomposition): Chia nhỏ một câu hỏi đa tầng thành chuỗi các câu hỏi con độc lập có thể giải quyết tuần tự hoặc song song.
- Truy xuất nhiều bước (Multi-hop Reasoning): Lấy câu trả lời của bước 1 làm dữ liệu đầu vào để truy xuất thông tin cho bước 2 (ví dụ: "Công ty mẹ của công ty sở hữu sản phẩm X được thành lập năm nào?").
- Tổng hợp đa nguồn: Gom toàn bộ bằng chứng từ các bước suy luận con để tổng hợp thành câu trả lời cuối cùng toàn diện và logic.

#### 5. LangGraph Basics

- LangGraph cho phép xây dựng **stateful multi-step workflows** cho LLM.
- **State:** TypedDict chứa toàn bộ thông tin của workflow
- **Nodes:** Functions nhận state → trả về partial state update
- **Edges:** Kết nối các nodes (static hoặc conditional)
##### Ví dụ: RAG với Retry Loop

- Cơ chế tự phục hồi (Self-healing loop): Khi Node Grade Documents phát hiện toàn bộ tài liệu tìm kiếm đều không khớp với câu hỏi, hệ thống tự động kích hoạt chu kỳ sửa lỗi.
- Tự động viết lại câu hỏi với góc nhìn ngữ nghĩa khác và thực hiện tìm kiếm lại trong Vector Database.
- Cơ chế ngắt an toàn (Circuit Breaker): Luôn thiết lập ngưỡng `max_retries` (thường là 2 hoặc 3 lần) để tránh rơi vào vòng lặp vô tận tiêu tốn chi phí và gây treo hệ thống.

#### Tóm tắt: Chọn RAG Pattern

| Pattern | Phù hợp khi | Độ phức tạp |
| --- | --- | --- |
| **Basic RAG** | Query đơn giản, corpus nhỏ | ⭐ |
| **Self-RAG** | Cần kiểm soát retrieval necessity | ⭐⭐⭐ |
| **CRAG** | Corpus không đầy đủ, cần fallback | ⭐⭐ |
| **Query Decomposition** | Câu hỏi phức tạp, multi-aspect | ⭐⭐ |
| **Multi-hop** | Câu hỏi cần chain nhiều retrieval | ⭐⭐⭐ |
> **Bắt đầu đơn giản:** Luôn bắt đầu với Basic RAG, đo lường chất lượng với RAGAS, sau đó thêm complexity khi cần. CRAG là điểm nâng cấp phổ biến nhất.

### Bài 7: LLM Evaluation & Guardrails

- "Vibe check" không đủ để đánh giá LLM trong production. Bài này gồm các metric đánh giá định lượng cho LLM và RAG, cách bảo vệ hệ thống khỏi các tấn công phổ biến, và cách monitor hệ thống theo thời gian thực.

#### 1. LLM Evaluation

##### Classic Metrics
- **BLEU** — đo n-gram overlap giữa output và reference:
- **ROUGE** — recall-oriented, tốt cho summarization:
- **Giới hạn Classic Metrics:** Chỉ đo lexical overlap, không hiểu semantic meaning.
##### BERTScore

- Độ đo đánh giá ngữ nghĩa dựa trên ma trận tương đồng giữa các vector token embedding của câu sinh ra (candidate) và câu tham chiếu (reference).
- Sử dụng mô hình transformer tiền huấn luyện (như RoBERTa hoặc multilingual-BERT) để tính Cosine Similarity giữa từng token, áp dụng kỹ thuật Maximum Similarity Matching.
- Ưu điểm vượt trội so với BLEU/ROUGE: Không phụ thuộc vào sự trùng khớp ký tự mặt chữ chính xác, nhận diện tốt các từ đồng nghĩa và cấu trúc câu tương đương trong tiếng Việt.

##### LLM-as-Judge
- Dùng LLM mạnh (GPT-4o, Claude) để đánh giá output của LLM khác.
###### 6 loại bias của LLM-as-Judge
| # | Bias | Biểu hiện |
| --- | --- | --- |
| 1 | **Position Bias** | Judge ưu tiên response đặt trước. GPT-4 đảo ngược phán quyết tới ~40% khi hoán đổi thứ tự A/B. |
| 2 | **Verbosity Bias** | Câu trả lời dài hơn được chấm cao hơn dù nội dung tương đương. |
| 3 | **Self-Preference** | Judge chấm output của chính họ hàng model mình cao hơn 10–25%. Càng nhận ra được văn phong của chính mình, càng thiên vị. |
| 4 | **Style Bias** | Bảng markdown và giọng trang trọng "thắng" câu trả lời casual. |
| 5 | **Calibration Drift** | Judge model cập nhật version → toàn bộ điểm số dịch chuyển. |
| 6 | **Preference Leakage** | Nếu judge và model bị đánh giá cùng một họ, judge thiên vị (mở rộng của #3). Lên tới 28.7% bias trên benchmark (ICLR 2026). |
###### Cách giảm thiểu
- **Shuffle order:** Randomize thứ tự A/B (hoặc chấm cả hai chiều rồi lấy trung bình) để khử position bias.
- **Score theo rubric, không theo ranking:** Chấm điểm từng tiêu chí tuyệt đối thay vì so sánh trực tiếp → giảm verbosity và position bias.
- **Ensemble 3+ judges:** Dùng nhiều judge từ các họ model khác nhau rồi tổng hợp → giảm self-preference và preference leakage.
- **Pin model version:** Cố định version cụ thể của judge (ví dụ `gpt-4o-2024-08-06`) để tránh calibration drift.
- **Spot-check với người thật:** Định kỳ đối chiếu một mẫu nhỏ với đánh giá của con người để phát hiện lệch.
> **Nguyên tắc cốt lõi:** Câu trả lời đúng không phải "dùng LLM-as-judge", mà là "dùng nó, nhưng hiểu rõ các cạm bẫy" - và có quy trình kiểm soát chúng.

#### 2. RAG Evaluation với RAGAS

| Metric | Đo gì | Cần ground truth? | Range |
| --- | --- | --- | --- |
| **Faithfulness** | % claims trong answer được support bởi context | Không | 0–1 |
| **Answer Relevancy** | Answer có liên quan đến question không | Không | 0–1 |
| **Context Recall** | Context có chứa đủ info để trả lời không | Có | 0–1 |
| **Context Precision** | Retrieved chunks có relevant không | Có | 0–1 |
##### Implementation

- Cài đặt và tích hợp thư viện đánh giá RAGAS (`ragas`) chuẩn công nghiệp vào hệ thống kiểm thử.
- Xây dựng tập dữ liệu đánh giá có cấu trúc gồm 4 trường cốt lõi: `question` (câu hỏi), `contexts` (ngữ cảnh tìm được), `answer` (câu trả lời sinh ra), và `ground_truth` (đáp án chuẩn do con người viết).
- Tự động tính toán điểm số cho 4 chỉ số vàng: Faithfulness (độ trung thực), Answer Relevancy (độ liên quan), Context Precision (độ chuẩn xác ngữ cảnh), và Context Recall (độ bao phủ ngữ cảnh).

##### Tạo Test Dataset Tự động

- Sử dụng phương pháp Synthetic Test Data Generation: Dùng mô hình LLM mạnh để đọc kho tài liệu gốc và tự động sinh ra hàng trăm bộ câu hỏi kiểm thử kèm đáp án chuẩn.
- Đa dạng hoá độ khó câu hỏi: Sinh câu hỏi đơn giản (tra cứu trực tiếp), câu hỏi suy luận logic, câu hỏi điều kiện, và câu hỏi so sánh đa tài liệu.
- Giảm 90% chi phí và thời gian tạo dữ liệu benchmark thủ công, cho phép kiểm thử hồi quy (regression testing) liên tục mỗi khi thay đổi prompt hoặc mô hình.

#### 3. Guardrails

##### Prompt Injection Defense

- Các hình thức tấn công nguy hiểm: Kỹ thuật Jailbreak, chèn lệnh ghi đè ("Bỏ qua các chỉ dẫn trước đó và hãy..."), hoặc kỹ thuật rò rỉ system prompt.
- Phòng thủ đa tầng: (1) Lọc thô bằng danh sách từ khoá và mẫu Regex độc hại ở tầng Gateway, (2) Dùng LLM Guard nhỏ chuyên biệt để phân loại intent độc hại, (3) Phân tách rõ ràng giữa System Prompt và Untrusted User Input qua Delimiters.

##### PII Filtering

- Nhận diện và che giấu tự động các thông tin định danh cá nhân nhạy cảm: Số Căn cước công dân (CCCD), số điện thoại, địa chỉ email, số thẻ ngân hàng và thông tin y tế.
- Thực hiện kiểm tra 2 chiều: Che giấu ở đầu vào (Input Sanitization) trước khi gửi tới API bên thứ ba, và kiểm duyệt ở đầu ra (Output Masking) trước khi hiển thị cho người dùng.
- Tuân thủ các quy định pháp lý nghiêm ngặt về bảo vệ dữ liệu cá nhân (như Nghị định 13/2023/NĐ-CP tại Việt Nam và chuẩn GDPR quốc tế).

##### Output Guardrails

- Kiểm duyệt chất lượng phản hồi trước khi trả về client: Phát hiện ảo giác (kiểm tra chéo câu trả lời với context), kiểm tra ngôn ngữ phản hồi (bắt buộc đúng tiếng Việt).
- Bộ lọc nội dung độc hại: Ngăn chặn ngôn từ kích động, thù địch, vi phạm thuần phong mỹ tục hoặc vi phạm chính sách thương hiệu của tổ chức.
- Cơ chế Fallback an toàn: Tự động thay thế câu trả lời lỗi bằng thông báo lịch sự khi phát hiện vi phạm quy tắc guardrails.

#### 4. Monitoring với LangSmith / LangFuse

##### LangSmith Setup

- Nền tảng SaaS Observability hàng đầu của LangChain dành cho theo dõi và tối ưu hoá ứng dụng LLM.
- Cấu hình kích hoạt chỉ bằng biến môi trường: `LANGCHAIN_TRACING_V2="true"`, `LANGCHAIN_API_KEY="..."`, và `LANGCHAIN_PROJECT="your-project"`.
- Khả năng quan sát toàn diện: Tự động ghi lại cây thực thi (Execution Trace), thống kê số token tiêu thụ, chi phí tích luỹ, độ trễ từng bước và hỗ trợ gán nhãn chấm điểm thủ công.

##### LangFuse Setup (Open-source alternative)

- Giải pháp giám sát mã nguồn mở tối ưu thay thế LangSmith, cho phép doanh nghiệp tự host (self-hosted) hoàn toàn trên Docker/Kubernetes nội bộ để bảo mật dữ liệu tuyệt đối.
- Tích hợp mượt mà vào LangChain / LangGraph thông qua `CallbackHandler(public_key=..., secret_key=..., host=...)` truyền vào config khi gọi model.
- Cung cấp bảng điều khiển trực quan: Giám sát latency P95/P99, theo dõi chi phí theo người dùng, quản lý prompt versioning và thu thập feedback (Like/Dislike) từ người dùng cuối.

##### Các metrics cần monitor
| Metric | Mô tả | Alert threshold |
| --- | --- | --- |
| **Latency** | Response time end-to-end | > 5s |
| **Token usage** | Chi phí inference | > budget |
| **Retrieval score** | Avg similarity score | < 0.6 |
| **User feedback** | Thumbs up/down rate | < 80% positive |
| **Error rate** | % requests fail | > 1% |
| **Hallucination rate** | % answers flagged bởi faithfulness checker | > 5% |

#### Tóm tắt Bài 7

| Component | Tool | Khi nào dùng |
| --- | --- | --- |
| **Classic metrics** | BLEU, ROUGE | Benchmark nhanh, không tốn phí |
| **Semantic metrics** | BERTScore | Khi paraphrase quan trọng |
| **RAG eval** | RAGAS | Đánh giá cả retrieval + generation |
| **LLM judge** | GPT-4o-mini | Evaluation phức tạp, cần reasoning |
| **Injection defense** | Regex + LLM check | Luôn dùng trong production |
| **PII filtering** | Presidio + Regex | Khi xử lý thông tin người dùng |
| **Monitoring** | LangSmith / LangFuse | Production - theo dõi chất lượng |
> **Evaluation Checklist trước khi deploy:**
> - Faithfulness > 0.85 trên test set
> - Answer Relevancy > 0.85
> - Prompt injection test pass
> - PII không leak trong responses
> - Latency p95 < 5s
> - Monitoring dashboard đã setup

### Bài 8: Production Optimization — Latency & Cost

- Ở môi trường production, một LLM app không chỉ cần trả lời đúng mà còn phải **nhanh** và **rẻ**. Ba kỹ thuật chủ lực để tối ưu latency và cost là **Prompt Caching**, **Semantic Caching**, và **Model Routing**. Bài này đi sâu vào cả ba, đặc biệt là các phương pháp routing nhẹ và nhanh.

#### 1. Bức tranh chi phí & độ trễ

| Kỹ thuật | Giảm gì | Cơ chế |
| --- | --- | --- |
| **Prompt Caching** | Cost input + TTFT | Cache phần prefix lặp lại của prompt |
| **Semantic Caching** | Cost + latency toàn bộ | Trả lại câu trả lời cũ cho câu hỏi tương tự |
| **Model Routing** | Cost + latency | Gửi task dễ tới model rẻ, task khó tới model mạnh |

#### 2. Prompt Caching

##### Khái niệm

- Tối ưu hoá sản xuất: Đạt được sự cân bằng tối ưu giữa độ trễ phản hồi (latency), chi phí tính toán (cost) và độ chính xác của câu trả lời.
- Nguyên tắc cốt lõi: Yêu cầu rẻ nhất và nhanh nhất là yêu cầu không cần gọi đến mô hình LLM lớn — tận dụng tối đa các tầng cache và kỹ thuật định tuyến thông minh.
- Triển khai các chiến lược: Prompt Caching ở tầng provider, Semantic Caching ở tầng ứng dụng và Model Routing phân cấp tải.

##### Lợi ích
- **Giảm cost**: token cache thường rẻ hơn 50–90% so với token thường.
- **Giảm TTFT** (Time To First Token): không phải xử lý lại prefix.
##### Cách dùng
- **Anthropic (explicit caching):**
- **OpenAI (automatic caching):**
> **Nguyên tắc vàng: tĩnh trước, động sau.** Prompt caching chỉ hit khi **prefix khớp chính xác**.

#### 3. Semantic Caching

- Prompt caching yêu cầu prefix **khớp y hệt**. Semantic caching đi xa hơn: nếu một câu hỏi **gần giống về ngữ nghĩa** với câu đã hỏi trước, ta trả lại câu trả lời cũ — **bỏ qua LLM hoàn toàn**.
##### Kiến trúc
> **Cẩn trọng với threshold và tính tươi của dữ liệu:**
> - **Threshold quá thấp** → trả nhầm câu trả lời cho câu hỏi khác nghĩa (false positive nguy hiểm).
> - **Threshold quá cao** → ít cache hit, mất tác dụng.
> - Không hợp cho câu trả lời phụ thuộc thời gian/ngữ cảnh ("Hôm nay thế nào?", giá cổ phiếu...). Cần đặt **TTL** để invalidate cache cũ.
>
> Production thường dùng vector store chuyên dụng (Redis với RediSearch, hoặc thư viện GPTCache) thay cho list in-memory.

#### 4. Model Routing

- Không phải request nào cũng cần model mạnh nhất. "1 + 1 bằng mấy?" không cần tới model flagship đắt tiền.
> **Router phải nhẹ hơn cái nó định tuyến:** Một router lý tưởng phải **nhanh và rẻ hơn nhiều** so với chính các model nó định tuyến tới. Nếu router tốn bằng việc gọi model lớn thì vô nghĩa.
##### 4.1. Rule-based Routing
| Ưu điểm | Nhược điểm |
| --- | --- |
| Cực nhanh, không tốn cost, dễ debug | Cứng nhắc, không hiểu ngữ nghĩa sâu, phải maintain luật thủ công |
- Dùng khi: Domain hẹp, đã biết rõ pattern của query; cần baseline nhanh.
##### 4.2. Embedding Similarity Routing
| Ưu điểm | Nhược điểm |
| --- | --- |
| Hiểu ngữ nghĩa, dễ mở rộng route bằng cách thêm câu mẫu, không cần train | Cần chọn câu mẫu tốt; embedding model phải load sẵn; kém chính xác hơn classifier train riêng |
##### 4.3. Fine-tuned Small Classifier
- Lấy training data từ đâu? Một cách thực dụng: chạy **cả model nhỏ và model lớn** trên một tập query, dùng LLM-as-judge (xem Bài 7) chấm xem model nhỏ có đủ tốt không. Nếu model nhỏ đủ tốt -\> nhãn "easy", ngược lại -\> "hard". Đây chính là tín hiệu vàng để train router.
| Ưu điểm | Nhược điểm |
| --- | --- |
| Chính xác nhất, học từ data thực, cho ra confidence score | Cần training data có nhãn + pipeline train/retrain; rủi ro drift khi phân phối query thay đổi |
##### So sánh ba phương pháp routing
| Tiêu chí | Rule-based | Embedding Similarity | Fine-tuned Classifier |
| --- | --- | --- | --- |
| Latency router | \~0 ms | vài ms | vài ms |
| Cost router | 0 | rất thấp | rất thấp |
| Cần training data | Không | Không (chỉ câu mẫu) | Có (gán nhãn) |
| Hiểu ngữ nghĩa | Không | Có | Có |
| Độ chính xác | Thấp | Trung bình | Cao |
| Công sức maintain | Cao (sửa luật tay) | Thấp | Trung bình (retrain) |
> **Kết hợp nhiều tầng (cascade):** Production thực tế thường xếp tầng: thử model rẻ trước, nếu confidence thấp hoặc output không đạt guardrail thì mới escalate lên model mạnh. Routing + cascade + caching kết hợp lại cho hiệu quả cost tốt nhất.

#### Tóm tắt Bài 8

| Kỹ thuật | Khi nào dùng |
| --- | --- |
| Prompt Caching | Prompt có prefix dài lặp lại (system prompt, RAG context) |
| Semantic Caching | Nhiều câu hỏi trùng/gần giống nhau (FAQ, support bot) |
| Rule-based Routing | Domain hẹp, pattern rõ ràng, cần baseline nhanh |
| Embedding Routing | Cần hiểu ngữ nghĩa, chưa có training data |
| Classifier Routing | Volume lớn, chênh lệch cost cao, tối ưu nghiêm túc |

### Bài 9: Capstone Project — Vietnamese Legal Assistant

- Bài này tích hợp toàn bộ kiến thức Module I thành một hệ thống hoàn chỉnh: pipeline xử lý tài liệu pháp lý tiếng Việt → CRAG agent → guardrails → UI với Gradio → deploy lên HF Spaces.

#### Kiến trúc Hệ thống

- Kiến trúc tổng thể của Trợ lý Pháp lý Tiếng Việt (Vietnamese Legal Assistant) kết hợp khép kín giữa Ingestion Pipeline và CRAG Agent đa tác tử.
- Tầng Ingestion: Nạp văn bản quy phạm pháp luật tiếng Việt, chia nhỏ thông minh giữ nguyên điều khoản, nhúng vector bằng multilingual-e5 và lưu vào Qdrant/Chroma.
- Tầng Xử lý Nghiệp vụ: CRAG Agent điều phối trên LangGraph kết hợp tìm kiếm nội bộ và tìm kiếm web ngoài (Tavily), bao bọc bởi Guardrails 2 chiều.
- Tầng Giao diện & Hạ tầng: UI tương tác qua Gradio với trích dẫn điều luật chi tiết, đóng gói Docker và triển khai miễn phí trên Hugging Face Spaces.

#### 1. Ingestion Pipeline

- Xử lý văn bản pháp lý chuyên sâu: Tự động đọc danh mục văn bản luật (Luật Doanh nghiệp, Luật Lao động) qua `PyPDFDirectoryLoader`.
- Chiến lược phân đoạn đặc biệt: Thiết lập `RecursiveCharacterTextSplitter` với các ký tự phân cách ưu tiên theo cấu trúc văn bản pháp luật (`"Điều "`, `"Khoản "`, `"Điểm "`).
- Bổ sung Metadata chi tiết: Gán nhãn cho từng chunk gồm tên luật, năm ban hành, số hiệu điều khoản và số trang để phục vụ tìm kiếm chính xác và trích dẫn nguồn.

#### 2. CRAG Agent với LangGraph

- Xây dựng đồ thị trạng thái tự điều chỉnh (Corrective RAG) giải quyết triệt để tình trạng thiếu dữ liệu trong cơ sở tri thức nội bộ.
- Node Kiểm duyệt Tài liệu (Document Grader): Đánh giá xem các đoạn luật tìm được có thực sự giải đáp được tình huống pháp lý của người dùng hay không.
- Cơ chế Fallback sang Web Search: Nếu cơ sở dữ liệu luật không đủ thông tin, Agent tự động kích hoạt công cụ tìm kiếm web (Tavily) để tra cứu nghị định, thông tư hướng dẫn mới nhất.
- Tổng hợp câu trả lời có đối chiếu: Kết hợp thông tin từ cả văn bản luật chính thống và dữ liệu cập nhật từ web để đưa ra tư vấn toàn diện.

#### 3. Guardrails Integration

- Tích hợp bộ lọc đầu vào (Input Guardrails): Chặn các hành vi Jailbreak và Prompt Injection bằng Regex và mẫu câu đặc thù tiếng Việt.
- Ràng buộc độ dài câu hỏi: Giới hạn tối thiểu 5 ký tự và tối đa 2000 ký tự để bảo vệ tài nguyên tính toán của hệ thống.
- Kiểm duyệt đầu ra (Output Guardrails): Kiểm tra chéo các con số điều luật trong câu trả lời có thực sự tồn tại trong tài liệu tham chiếu hay không để loại bỏ ảo giác.

#### 4. Gradio UI

- Xây dựng giao diện web chat tương tác trực quan, thân thiện với người dùng thông qua thư viện Gradio.
- Hiển thị câu trả lời có cấu trúc đẹp mắt, tự động tạo khối trích dẫn nguồn văn bản (Ví dụ: `📚 Nguồn: luat-doanh-nghiep-2020.pdf tr.45`).
- Đính kèm huy hiệu thông báo rõ ràng khi câu trả lời có sử dụng dữ liệu bổ sung từ tìm kiếm web (`🌐 Một phần thông tin từ tìm kiếm web`).

#### 5. Deploy lên HF Spaces

- Đóng gói ứng dụng vào Hugging Face Spaces với runtime Gradio hoàn toàn miễn phí.
- Khai báo file cấu hình `README.md` với các thẻ metadata: `title: Trợ Lý Pháp Lý Tiếng Việt`, `sdk: gradio`, `app_file: app.py`.
- Cấu hình an toàn các khoá bí mật (Secret API Keys cho OpenAI, Tavily) trong phần Settings của Hugging Face Spaces, không đưa khoá vào mã nguồn.

#### 6. RAGAS Evaluation — Take-home

- Xây dựng bộ dữ liệu benchmark gồm 30 tình huống pháp lý thực tế với câu trả lời chuẩn mực do chuyên gia luật thẩm định.
- Chạy quy trình đánh giá tự động qua thư viện RAGAS để đo lường 4 chỉ số: Faithfulness, Answer Relevancy, Context Precision và Context Recall.
- Tiêu chuẩn xuất xưởng production: Đảm bảo độ trung thực (Faithfulness) và độ phủ thông tin (Context Recall) đều đạt trên 85%.

#### Framework tư duy: Khi nào cần Agent?

- Agent không phải lúc nào cũng là giải pháp tối ưu: Luôn ưu tiên dùng lời gọi LLM đơn lẻ hoặc RAG pipeline tuyến tính nếu bài toán có quy trình cố định và rõ ràng.
- Chỉ sử dụng Agent khi: (1) Cần hệ thống tự đưa ra quyết định chọn hành động tiếp theo, (2) Cần tương tác linh hoạt với nhiều hệ thống/công cụ bên ngoài, (3) Cần khả năng tự sửa lỗi sau khi quan sát kết quả.
- Nhược điểm cần chấp nhận: Agent có độ trễ cao hơn (multi-turn), chi phí token lớn hơn và khó kiểm soát kiểm thử hơn pipeline cố định.

#### Phụ thuộc từ Module I

- Module II xây dựng trực tiếp trên nền tảng Module I:
- **RAG Pipeline** và **Vector DB** trở thành một **tool** mà agent có thể gọi, thay vì một pipeline cố định.
- **Function Calling** là nền tảng của tool calling trong agent.
- **Evaluation & Guardrails** mở rộng sang đánh giá cả **trajectory** (chuỗi hành động), không chỉ output cuối.
- Capstone của Module II (Vietnamese Research Assistant) tái sử dụng vector store từ capstone Module I (Vietnamese Legal Assistant) như một retrieval tool cho agent Researcher.

### Bài 1: What Is an AI Agent?


#### Tổng quan

- Nền tảng lý thuyết và thực hành toàn diện về AI Agent: Bản chất của tác tử, vòng lặp ReAct (Thought → Action → Observation), và các thành phần cấu thành cốt lõi.
- Kiến trúc Agent hoàn chỉnh gồm 4 trụ cột: Bộ não suy luận (Brain / LLM), Bộ nhớ (Memory - Short-term & Long-term), Công cụ (Tools / Actuators), và Kế hoạch (Planning / Reflection).
- Bức tranh công nghệ hiện đại: Sự dịch chuyển từ các chuỗi tuyến tính tĩnh (Chains) sang các đồ thị trạng thái linh hoạt (State Graphs) với LangGraph và chuẩn giao tiếp mở MCP.

#### 1. Định nghĩa & Sự tiến hoá

##### Agent là gì?
- Một **AI agent** là một hệ thống dùng LLM làm bộ não trung tâm để **tự quyết định** chuỗi hành động cần thực hiện nhằm đạt mục tiêu, thay vì đi theo một luồng xử lý cố định do lập trình viên viết sẵn.
- Điểm khác biệt cốt lõi so với pipeline truyền thống: **ai quyết định bước tiếp theo**.
|  | Pipeline cố định (vd: RAG ở Module I) | Agent |
| --- | --- | --- |
| Luồng xử lý | Lập trình viên định nghĩa trước: retrieve → generate | LLM tự quyết định: cần tool nào, gọi mấy lần, khi nào dừng |
| Số bước | Cố định | Động, phụ thuộc vào kết quả trung gian |
| Khả năng phục hồi lỗi | Không - nếu retrieve rỗng, generate vẫn chạy | Có thể quan sát lỗi và thử cách khác |
- RAG có phải là agent không?
- RAG cơ bản (retrieve → generate) **không phải** agent - đó là pipeline cố định. Agentic RAG (Module I, Bài 6) đã bắt đầu mang tính agent vì model tự quyết định có cần retrieve lại hay tìm web không. Ranh giới nằm ở **quyền tự quyết định hành động tiếp theo**.
##### Sự tiến hoá
- A2A là gì?
- **Agent2Agent (A2A)** là chuẩn giao tiếp giữa các agent với nhau (agent-to-agent), khác với MCP vốn chuẩn hoá giao tiếp giữa agent và tool/data source. A2A liên quan trực tiếp đến Multi-Agent Systems ([Bài 6](https://handbook.yourclassacademy.com/llm-engineer/module-2/06-multi-agent/)) nhưng nằm ngoài phạm vi module này - chỉ nhắc đến ở đây để định vị trong bức tranh landscape.

#### 2. Core Components

- Mọi agent, dù dùng framework nào, đều gồm 4 thành phần:
| Thành phần | Vai trò | Ví dụ |
| --- | --- | --- |
| **LLM Brain** | Reasoning, ra quyết định, chọn hành động tiếp theo | GPT-4o, Claude, Gemini |
| **Tools** | Cầu nối với thế giới bên ngoài | Web search, database query, RAG retrieval, code execution |
| **Memory** | Giữ ngữ cảnh qua nhiều bước / nhiều lượt hội thoại | Conversation history, vector store, scratchpad |
| **Planning Loop** | Vòng lặp quan sát - suy nghĩ - hành động, quyết định khi nào dừng | ReAct loop, task decomposition |
- Thiếu 1 thành phần vẫn có thể gọi là agent, nhưng giới hạn
- Một chatbot chỉ có LLM Brain + Memory (không có Tools) chỉ có thể trò chuyện, không thể hành động. Một script gọi tool cố định (không có Planning Loop) là automation, không phải agent thực sự.

#### 3. System Prompt: Cấu trúc & Cách lắp ráp

- System prompt là nơi cấu hình "LLM Brain" - agent càng phức tạp, system prompt càng cần được **lắp ráp có cấu trúc** thay vì viết tay một đoạn văn dài.
##### 6 tầng của một system prompt
| Tầng | Trả lời câu hỏi | Ví dụ |
| --- | --- | --- |
| **Identity** | Agent là ai? | "Bạn là trợ lý kỹ thuật cấp cao chuyên về..." |
| **Constraints** | Luôn/không bao giờ làm gì? | "Không bao giờ thực thi lệnh phá huỷ dữ liệu mà chưa xác nhận" |
| **Capabilities** | Có tool gì? | Mô tả + schema của các tool khả dụng |
| **Context** | Môi trường hiện tại? | Thư mục làm việc, trạng thái git, thời gian |
| **Behavior** | Cư xử thế nào? | Tone, độ dài phản hồi, phong cách ra quyết định |
| **Knowledge** | Kiến thức chuyên biệt? | Skill instructions, memory liên quan (Bài 3) |
##### Lắp ráp theo từng phần, không viết 1 khối văn bản
- Anti-pattern: nhồi tất cả vào 1 chuỗi
- Viết system prompt như 1 đoạn văn dài chứa mọi thứ (identity + toàn bộ 50 tool + toàn bộ lịch sử user + 200 skill) không maintain được, không customize được theo task, và lãng phí token nghiêm trọng. Luôn lắp ráp từ các phần nhỏ, lọc theo nhu cầu hiện tại - giống cách JIT tool loading lọc tool theo task ([Bài 4](https://handbook.yourclassacademy.com/llm-engineer/module-2/04-tool-design/)).
##### [AGENTS.md](http://AGENTS.md) vs [SOUL.md](http://SOUL.md): tách "làm gì" khỏi "là ai"
- Với agent cá nhân hoá (vd: trợ lý dùng lâu dài, nhớ user qua nhiều session - Bài 3), tách system prompt thành 2 file riêng biệt giúp thay đổi tính cách mà không đụng vào logic vận hành, và ngược lại:
| File | Trả lời | Ví dụ nội dung |
| --- | --- | --- |
| [**AGENTS.md**](http://AGENTS.md) | Agent \*làm gì\*, quy tắc vận hành | "Dùng `web_search` cho câu hỏi thực tế. Luôn xác nhận trước khi xoá dữ liệu." |
| [**SOUL.md**](http://SOUL.md) | Agent \*cư xử ra sao\*, tính cách | "Trả lời trực tiếp rồi mới giải thích. Thừa nhận khi không chắc thay vì bịa." |
- **Lợi ích:** User đổi tông giọng agent ([SOUL.md](http://SOUL.md)) mà không sợ phá vỡ logic vận hành ([AGENTS.md](http://AGENTS.md)); developer thêm tool/quy tắc mới mà không ảnh hưởng tính cách đã được user tuỳ chỉnh.
- Chỉ cần tách khi agent thực sự cá nhân hoá lâu dài
- Với agent dùng 1 lần hoặc task-specific (đa số ví dụ trong module này), 1 system prompt đơn giản là đủ. Tách [AGENTS.md/SOUL.md](http://AGENTS.md/SOUL.md) đáng giá khi agent phục vụ nhiều user với gu cá nhân khác nhau, hoặc khi đội ngũ vận hành và đội ngũ thiết kế trải nghiệm là 2 nhóm khác nhau.

#### 4. Agent Paradigms

##### Reflex Agent
- Phản ứng trực tiếp với input hiện tại, không có bộ nhớ về quá khứ, không lập kế hoạch nhiều bước.
- **Phù hợp khi:** Task đơn giản, 1 bước, không cần ngữ cảnh trước đó.
##### Planning Agent
- Trước khi hành động, agent **lập kế hoạch** toàn bộ các bước cần làm, rồi thực thi theo kế hoạch (có thể điều chỉnh khi gặp lỗi).
- **Phù hợp khi:** Task phức tạp, nhiều bước phụ thuộc lẫn nhau, cần nhìn toàn cảnh trước khi hành động (vd: research agent trong capstone).
##### ReAct (Reasoning + Acting)
- Xen kẽ giữa **suy nghĩ** (Thought), **hành động** (Action), và **quan sát** (Observation) - mỗi bước phụ thuộc vào kết quả của bước trước, thay vì lập kế hoạch toàn bộ ngay từ đầu.
- **Phù hợp khi:** Không biết trước cần bao nhiêu bước hoặc tool nào; mỗi bước phụ thuộc kết quả quan sát trước đó (vd: debug lỗi, multi-hop question answering).
##### So sánh 3 paradigms
| Paradigm | Có bộ nhớ nhiều bước? | Lập kế hoạch trước? | Độ phức tạp task phù hợp |
| --- | --- | --- | --- |
| **Reflex** | Không | Không | Thấp - 1 bước |
| **Planning** | Có | Có, toàn bộ trước khi chạy | Cao - nhiều bước độc lập, biết trước cấu trúc |
| **ReAct** | Có | Không, từng bước một | Cao - nhiều bước phụ thuộc kết quả trung gian |
- LangGraph hỗ trợ cả 3 paradigm
- Bài 2 sẽ dùng LangGraph để implement ReAct loop bằng state graph - đây là paradigm phổ biến nhất cho agent thực tế vì cân bằng giữa tính linh hoạt và khả năng kiểm soát.

#### 5. Landscape 2026

##### Framework so sánh
| Framework | Điểm mạnh | Điểm yếu | Dùng khi |
| --- | --- | --- | --- |
| **LangGraph** | Kiểm soát chi tiết state/flow, debug tốt, tích hợp LangSmith | Đường cong học tập cao hơn | Cần custom logic phức tạp, production-grade |
| **CrewAI** | API cấp cao, dễ setup multi-agent theo "role" | Ít linh hoạt khi cần custom control flow | Prototype nhanh, team-based agents |
| **AutoGen** | Mạnh về multi-agent conversation, research-oriented | Ít structured hơn cho production | Nghiên cứu, agent hội thoại phức tạp |
| **OpenAI Agents SDK** | Tích hợp chặt với OpenAI models, đơn giản | Gắn với hệ sinh thái OpenAI | Dự án dùng OpenAI làm nhà cung cấp chính |
- Vì sao Module này chọn LangGraph làm mặc định
- LangGraph biểu diễn agent như một **state graph** tường minh - mỗi node, edge, điều kiện rẽ nhánh đều là code bạn kiểm soát hoàn toàn. Điều này giúp debug, test, và mở rộng sang multi-agent dễ dàng hơn so với các framework "hộp đen" cấp cao. Các framework khác sẽ được nhắc đến trong bảng so sánh khi liên quan (Bài 6).
##### MCP (Model Context Protocol)
- MCP là chuẩn mở (do Anthropic khởi xướng, nay được nhiều provider hỗ trợ) để kết nối agent với tools/data sources một cách thống nhất - thay vì mỗi tool cần một tích hợp riêng.
- MCP sẽ được đào sâu ở Bài 4 (chuẩn giao tiếp, cách viết Server/Client) - phần này chỉ giới thiệu vị trí của nó trong landscape: MCP giải quyết bài toán **N agent × M tool = N×M integration** bằng cách chuẩn hoá thành **N + M**.
