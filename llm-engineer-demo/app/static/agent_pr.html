<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VN-Stock Hierarchical Agent — Demo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --sidebar: #13151b;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b90a0;
    --accent: #4f7cff;
    --user-bubble: #4f7cff;
    --bot-bubble: #1f232c;
    --error: #ff5c6c;
    --warn: #d9a441;
    --sidebar-w: 272px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-head {
    padding: 14px 12px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sidebar-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #new-thread {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  #new-thread:hover { filter: brightness(1.08); }
  #session-list {
    list-style: none;
    margin: 0;
    padding: 8px;
    overflow-y: auto;
    flex: 1;
  }
  #session-list li {
    display: flex;
    align-items: stretch;
    gap: 4px;
    margin-bottom: 4px;
  }
  .session-btn {
    flex: 1;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    cursor: pointer;
    min-width: 0;
  }
  .session-btn:hover { background: var(--panel); }
  .session-btn.active {
    background: var(--panel);
    border-color: var(--border);
  }
  .session-title {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-time {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }
  .session-del {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 0 8px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1;
  }
  .session-del:hover { color: var(--error); background: rgba(255,92,108,0.08); }

  #main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .sub { font-size: 12px; color: var(--muted); }
  .symbols { font-size: 11px; color: var(--muted); }
  #sidebar-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-row.user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 3px; }
  .msg-row.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg-row.error .bubble { background: rgba(255, 92, 108, 0.12); border: 1px solid var(--error); color: var(--error); }
  .typing { color: var(--muted); font-style: italic; font-size: 13px; }

  details.trace { margin-top: 8px; font-size: 12px; }
  details.trace summary { cursor: pointer; color: var(--accent); }
  .trace-step {
    margin-top: 6px;
    padding: 6px 8px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .eval-btn {
    margin-top: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .eval-btn:hover { color: var(--accent); border-color: var(--accent); }
  .eval-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .eval-card {
    margin-top: 8px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
  }
  .eval-title { font-weight: 600; margin-bottom: 8px; }
  .eval-section { margin-bottom: 10px; }
  .eval-section:last-child { margin-bottom: 0; }
  .eval-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin-bottom: 4px; }
  .eval-badge {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px; padding: 2px 10px; font-size: 12px; border: 1px solid var(--border);
  }
  .eval-badge.pass { color: #4caf6a; border-color: #4caf6a; background: rgba(76,175,106,0.08); }
  .eval-badge.fail { color: var(--error); border-color: var(--error); background: rgba(255,92,108,0.08); }
  .eval-reasoning { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .eval-scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; margin-top: 4px; }
  .eval-score-item { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 8px; text-align: center; }
  .eval-score-item .score-value { font-size: 15px; font-weight: 600; color: var(--accent); }
  .eval-score-item .score-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .eval-issues { margin-top: 6px; font-size: 12px; color: var(--warn); }
  .eval-issues li { margin-left: 16px; }
  .eval-error { color: var(--error); font-size: 12px; }

  #input-bar {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #question {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 48px;
    max-height: 160px;
    line-height: 1.45;
  }
  #question:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    height: 48px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .meta { margin-top: 8px; font-size: 11px; color: var(--muted); }

  @media (max-width: 800px) {
    #sidebar {
      position: fixed;
      z-index: 20;
      left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    #app.sidebar-open #sidebar { transform: translateX(0); }
    #sidebar-toggle { display: inline-block; }
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 15;
    }
    #app.sidebar-open #sidebar-backdrop { display: block; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-head">
      <h2>Hội thoại</h2>
      <button type="button" id="new-thread">+ Mới</button>
    </div>
    <ul id="session-list"></ul>
  </aside>
  <div id="sidebar-backdrop"></div>

  <div id="main">
    <header>
      <div>
        <button type="button" id="sidebar-toggle">☰ Hội thoại</button>
        <h1>VN-Stock Hierarchical Agent</h1>
        <div class="sub">Hỏi tiếng Việt — hub LLM chọn Price · News · DB · Eval · Synthesis</div>
        <div class="sub" id="session-meta"></div>
      </div>
      <div class="symbols">Mã niêm yết VN (HOSE / HNX / UPCOM)</div>
    </header>

    <div id="messages"></div>

    <div id="input-bar">
      <textarea id="question" rows="2" placeholder="Hỏi về cổ phiếu, ví dụ: Tại sao HPG giảm? (Enter gửi, Shift+Enter xuống dòng)"></textarea>
      <button id="send-btn">Gửi</button>
    </div>
  </div>
</div>

<script>
const SESSIONS_KEY = "pr_sessions_v1";
const THREAD_KEY = "pr_thread_id";
const USER_KEY = "pr_user_id";
const WELCOME =
  "Hỏi bằng tiếng Việt. Ví dụ: «Tại sao HPG giảm?» hoặc «giá MWG hôm nay». Mọi mã niêm yết VN. Chọn hội thoại bên trái để mở lại phiên cũ (cùng thread_id trên server).";

const messagesEl = document.getElementById("messages");
const questionEl = document.getElementById("question");
const sendBtn = document.getElementById("send-btn");
const sessionMeta = document.getElementById("session-meta");
const sessionListEl = document.getElementById("session-list");
const newThreadBtn = document.getElementById("new-thread");
const appEl = document.getElementById("app");

function storageId(key) {
  let v = localStorage.getItem(key);
  if (!v) {
    v = crypto.randomUUID();
    localStorage.setItem(key, v);
  }
  return v;
}

function loadSessions() {
  try {
    const raw = JSON.parse(localStorage.getItem(SESSIONS_KEY)) || [];
    return Array.isArray(raw) ? raw : [];
  } catch {
    return [];
  }
}

function saveSessions() {
  localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
}

const userId = storageId(USER_KEY);
let sessions = loadSessions();
let threadId = localStorage.getItem(THREAD_KEY) || "";

function emptySession(id) {
  return { id, title: "Đoạn chat mới", updatedAt: Date.now(), messages: [] };
}

function ensureActiveSession() {
  if (threadId && sessions.some((s) => s.id === threadId)) return;
  const legacy = localStorage.getItem(THREAD_KEY);
  if (legacy && sessions.some((s) => s.id === legacy)) {
    threadId = legacy;
    return;
  }
  if (!sessions.length) {
    threadId = legacy || crypto.randomUUID();
    sessions = [emptySession(threadId)];
    saveSessions();
  } else {
    threadId = sessions[0].id;
  }
  localStorage.setItem(THREAD_KEY, threadId);
}

function currentSession() {
  return sessions.find((s) => s.id === threadId);
}

function setActiveThread(id) {
  threadId = id;
  localStorage.setItem(THREAD_KEY, id);
  renderSessionMeta();
  renderSessionList();
  renderAll();
}

function touchSession(mutator) {
  const s = currentSession();
  if (!s) return;
  mutator(s);
  s.updatedAt = Date.now();
  sessions.sort((a, b) => b.updatedAt - a.updatedAt);
  saveSessions();
  renderSessionList();
}

function titleFromText(text) {
  const t = (text || "").trim().replace(/\s+/g, " ");
  return t.length > 42 ? t.slice(0, 41) + "…" : t || "Đoạn chat mới";
}

function formatWhen(ts) {
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" });
}

function renderSessionMeta() {
  sessionMeta.textContent =
    "phiên " + threadId.slice(0, 8) + " · user " + userId.slice(0, 8);
}

function renderSessionList() {
  sessionListEl.innerHTML = "";
  for (const s of sessions) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "session-btn" + (s.id === threadId ? " active" : "");
    btn.innerHTML =
      `<div class="session-title"></div><div class="session-time"></div>`;
    btn.querySelector(".session-title").textContent = s.title;
    btn.querySelector(".session-time").textContent = formatWhen(s.updatedAt);
    btn.addEventListener("click", () => {
      setActiveThread(s.id);
      appEl.classList.remove("sidebar-open");
    });
    const del = document.createElement("button");
    del.type = "button";
    del.className = "session-del";
    del.title = "Xoá hội thoại";
    del.textContent = "×";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteSession(s.id);
    });
    li.appendChild(btn);
    li.appendChild(del);
    sessionListEl.appendChild(li);
  }
}

function deleteSession(id) {
  sessions = sessions.filter((s) => s.id !== id);
  if (!sessions.length) {
    const created = emptySession(crypto.randomUUID());
    sessions = [created];
    saveSessions();
    setActiveThread(created.id);
    return;
  }
  saveSessions();
  if (threadId === id) setActiveThread(sessions[0].id);
  else renderSessionList();
}

function newSession() {
  const created = emptySession(crypto.randomUUID());
  sessions.unshift(created);
  saveSessions();
  setActiveThread(created.id);
  questionEl.focus();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderTrace(bubble, msg) {
  const bits = [];
  if (msg.used && msg.used.length) bits.push("agent: " + msg.used.join(" · "));
  if (msg.reasoning) bits.push(msg.reasoning);
  if (bits.length) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = bits.join(" — ");
    bubble.appendChild(meta);
  }
  if (!msg.trace || !msg.trace.length) return;
  const details = document.createElement("details");
  details.className = "trace";
  const summary = document.createElement("summary");
  summary.textContent = `${msg.trace.length} bước điều phối`;
  details.appendChild(summary);
  msg.trace.forEach((step) => {
    const div = document.createElement("div");
    div.className = "trace-step";
    div.textContent = step;
    details.appendChild(div);
  });
  bubble.appendChild(details);
}

function renderEvalCard(body) {
  const card = document.createElement("div");
  card.className = "eval-card";

  const title = document.createElement("div");
  title.className = "eval-title";
  title.textContent = "📊 Kết quả đánh giá";
  card.appendChild(title);

  const successSection = document.createElement("div");
  successSection.className = "eval-section";
  const successLabel = document.createElement("div");
  successLabel.className = "eval-label";
  successLabel.textContent = "Task Success";
  successSection.appendChild(successLabel);

  const ts = body.task_success;
  const badge = document.createElement("span");
  badge.className = `eval-badge ${ts.success ? "pass" : "fail"}`;
  badge.textContent = `${ts.success ? "✓ Đạt" : "✗ Chưa đạt"} — điểm ${(ts.score * 100).toFixed(0)}%`;
  successSection.appendChild(badge);

  const reasoning = document.createElement("div");
  reasoning.className = "eval-reasoning";
  reasoning.textContent = ts.reasoning;
  successSection.appendChild(reasoning);
  card.appendChild(successSection);

  const trajSection = document.createElement("div");
  trajSection.className = "eval-section";
  const trajLabel = document.createElement("div");
  trajLabel.className = "eval-label";
  trajLabel.textContent = `Trajectory Quality (${body.step_count} bước, điểm TB ${body.trajectory.overall.toFixed(1)}/5)`;
  trajSection.appendChild(trajLabel);

  const scores = document.createElement("div");
  scores.className = "eval-scores";
  const scoreDefs = [
    ["efficiency", "Hiệu quả"],
    ["logical_order", "Thứ tự logic"],
    ["tool_correctness", "Đúng tool"],
    ["recovery", "Xử lý lỗi"],
  ];
  for (const [key, label] of scoreDefs) {
    const item = document.createElement("div");
    item.className = "eval-score-item";
    const value = document.createElement("div");
    value.className = "score-value";
    value.textContent = `${body.trajectory[key]}/5`;
    const lbl = document.createElement("div");
    lbl.className = "score-label";
    lbl.textContent = label;
    item.appendChild(value);
    item.appendChild(lbl);
    scores.appendChild(item);
  }
  trajSection.appendChild(scores);

  if (body.trajectory.issues && body.trajectory.issues.length) {
    const issuesList = document.createElement("ul");
    issuesList.className = "eval-issues";
    for (const issue of body.trajectory.issues) {
      const li = document.createElement("li");
      li.textContent = issue;
      issuesList.appendChild(li);
    }
    trajSection.appendChild(issuesList);
  }

  card.appendChild(trajSection);
  return card;
}

function renderMessage(msg) {
  const row = document.createElement("div");
  row.className = `msg-row ${msg.role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.appendChild(document.createTextNode(msg.text));
  row.appendChild(bubble);
  if (msg.role === "bot") {
    renderTrace(bubble, msg);
    if (msg.evalResult) {
      bubble.appendChild(renderEvalCard(msg.evalResult));
    } else if (msg.evalError) {
      const err = document.createElement("div");
      err.className = "eval-error";
      err.textContent = `Lỗi đánh giá: ${msg.evalError}`;
      bubble.appendChild(err);
    } else if (msg.canEvaluate) {
      const evalBtn = document.createElement("button");
      evalBtn.className = "eval-btn";
      evalBtn.textContent = "📊 Đánh giá";
      evalBtn.addEventListener("click", () => runEvaluation(msg, evalBtn));
      bubble.appendChild(evalBtn);
    }
  }
  messagesEl.appendChild(row);
  return { row, bubble };
}

function renderAll() {
  messagesEl.innerHTML = "";
  const s = currentSession();
  const msgs = (s && s.messages) || [];
  if (!msgs.length) {
    renderMessage({ role: "bot", text: WELCOME });
  } else {
    for (const m of msgs) renderMessage(m);
  }
  scrollToBottom();
}

function memoryPayload(question) {
  return { question, thread_id: threadId, user_id: userId };
}

async function runEvaluation(msg, btn) {
  btn.disabled = true;
  btn.textContent = "⏳ Đang đánh giá...";
  try {
    const res = await fetch("/pr/ask/evaluate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(memoryPayload(msg.question || "")),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
    msg.evalResult = body;
  } catch (err) {
    msg.evalError = err.message;
  }
  saveSessions();
  renderAll();
}

async function sendQuestion() {
  const question = questionEl.value.trim();
  if (!question) return;

  questionEl.value = "";
  sendBtn.disabled = true;

  touchSession((s) => {
    s.messages.push({ role: "user", text: question });
    if (s.title === "Đoạn chat mới") s.title = titleFromText(question);
  });
  renderAll();

  const { bubble } = renderMessage({ role: "bot", text: "" });
  const typing = document.createElement("span");
  typing.className = "typing";
  typing.textContent = "Hub đang chọn worker rồi thu thập...";
  bubble.textContent = "";
  bubble.appendChild(typing);
  scrollToBottom();

  try {
    const res = await fetch("/pr/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(memoryPayload(question)),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);

    if (body.thread_id && body.thread_id !== threadId) {
      const s = currentSession();
      if (s) s.id = body.thread_id;
      threadId = body.thread_id;
      localStorage.setItem(THREAD_KEY, threadId);
      saveSessions();
    }
    renderSessionMeta();

    const botMsg = {
      role: "bot",
      text: body.answer,
      question,
      trace: body.trace,
      used: body.used_agents,
      reasoning: body.plan_reasoning,
      canEvaluate: true,
    };
    touchSession((s) => s.messages.push(botMsg));
    renderAll();
  } catch (err) {
    touchSession((s) => s.messages.push({ role: "error", text: `Lỗi: ${err.message}` }));
    renderAll();
  } finally {
    sendBtn.disabled = false;
    questionEl.focus();
    scrollToBottom();
  }
}

ensureActiveSession();
renderSessionMeta();
renderSessionList();
renderAll();

newThreadBtn.addEventListener("click", newSession);
document.getElementById("sidebar-toggle").addEventListener("click", () => {
  appEl.classList.toggle("sidebar-open");
});
document.getElementById("sidebar-backdrop").addEventListener("click", () => {
  appEl.classList.remove("sidebar-open");
});
questionEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
});
sendBtn.addEventListener("click", sendQuestion);
questionEl.focus();
</script>
</body>
</html>
