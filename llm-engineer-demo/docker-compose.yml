# FastAPI VN-stock — service `app` :8000 (API + UI tĩnh)
#
#   docker compose up --build -d          # app (SQLite: dữ liệu + checkpointer)
#   docker compose --profile rag up -d    # + Qdrant (RAG Module I)
#   docker compose down
#
# UI:   http://localhost:8000/
# Docs: http://localhost:8000/docs
# Ask:  POST http://localhost:8000/pr/ask  {"question":"Tại sao HPG giảm?","thread_id":"sess-1"}
# .env (OPENAI_API_KEYS) không copy vào image — compose đọc env_file.

services:
  app:
    build: .
    container_name: vn-stock-api
    env_file:
      - .env
    environment:
      # .env LANGFUSE_HOST=localhost:3000 chỉ đúng khi uvicorn chạy trên máy host.
      # Trong container localhost = chính app; Langfuse web nằm trên host :3000.
      LANGFUSE_HOST: http://host.docker.internal:3000
      # .env QDRANT_URL=localhost:6333 chỉ đúng ngoài Docker. Trong mạng compose hostname là `qdrant`.
      QDRANT_URL: http://qdrant:6333
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      # Local: 15s làm log uvicorn đầy GET /health. 2 phút vẫn đủ Docker biết container sống.
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 45s

  qdrant:
    profiles: ["rag"]
    image: qdrant/qdrant:latest
    container_name: legal-qdrant
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
