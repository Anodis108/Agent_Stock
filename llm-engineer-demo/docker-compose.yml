# API agent_pr + Qdrant (RAG buổi 5, không bắt buộc cho /pr/ask).
#
#   docker compose up --build        # app :8000 + qdrant
#   docker compose up --build app    # chỉ FastAPI (giá/tin/eval)
#   docker compose down
#
# Hub: POST http://localhost:8000/pr/ask  {"symbol":"HPG"}
# Docs: http://localhost:8000/docs
services:
  app:
    build: .
    container_name: llm-engineer-demo
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-qdrant
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage   # persist dữ liệu qua các lần restart
    restart: unless-stopped
