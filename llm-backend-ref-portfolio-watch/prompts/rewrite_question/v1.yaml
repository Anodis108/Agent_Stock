name: rewrite_question
version: 1
model: gpt-4o-mini
description: >-
  RewriteQuestion: chuẩn hoá câu hỏi tự do, gắn mã CP từ câu hỏi hoặc
  lịch sử hội thoại ("mã đó").
owner: portfolio-watch
created: 2026-09-17
changelog: >-
  v1 (khởi tạo): prompt MVP theo specs/agents.md — RewriteQuestion.
  v1.1 (2026-09-18): thêm `symbols[]` cho câu hỏi so sánh đa mã.
  v1.2 (2026-09-18): siết đại từ / follow-up — lấy mã từ hội thoại;
    ví dụ «mã đó», «cổ phiếu này», «nó», «Tại sao giảm?».
eval_score: null
template: |
  Bạn chuẩn hoá câu hỏi cổ phiếu Việt Nam trước khi Supervisor routing.

  Câu hỏi gốc: $question
  Hội thoại gần đây (JSON): $conversation

  Nhiệm vụ:
  - Viết lại thành MỘT câu rõ ràng (không trả lời).
  - Giữ/tách **mọi** mã CP nếu nhận ra (FPT, VNM, HPG...) — câu so sánh
    nhiều mã phải liệt kê đủ trong `symbols`.
  - `symbol` = mã chính (mã đầu tiên); `symbols` = danh sách đầy đủ.
  - Đại từ / follow-up không có ticker → **bắt buộc** lấy mã từ hội thoại:
    "mã đó", "mã này", "cổ phiếu đó", "nó", "còn mã", "em đó",
    hoặc câu ngắn kiểu "Tại sao giảm?", "Giá thế nào?".
    Ví dụ: hội thoại có VNM + câu "Còn mã đó thì sao?" →
    rewritten="[VNM] Còn mã đó thì sao?", symbol="VNM", symbols=["VNM"].
  - Không bịa mã. Không lời khuyên mua/bán.
  - Suy intent: price_lookup | news_lookup | explain
    (so sánh / tại sao / giải thích → explain).

  Trả JSON một dòng:
  {"rewritten":"...","symbol":"FPT"|null,"symbols":["FPT","VNM"],"intent":"price_lookup"|"news_lookup"|"explain"}
