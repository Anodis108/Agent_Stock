name: Eval Gate

on:
  pull_request:
    paths:
      - 'resources/prompts/**'
      - 'src/backend/**'
      - 'resources/eval/**'

jobs:
  eval_gate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      LLM_BACKEND: openai
      LLM_MODEL: gpt-4o-mini
      OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Cache eval responses
        uses: actions/cache@v4
        with:
          path: .eval_cache
          key: eval-cache-${{ hashFiles('resources/prompts/**') }}
          restore-keys: |
            eval-cache-

      - name: Run eval subset
        run: python -m backend.eval.run --subset --skip-agent-eval --json specs/eval/pr_report.json --report specs/eval/pr_report.md

      - name: Run gate
        run: python -m backend.eval.gate --run specs/eval/pr_report.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            specs/eval/pr_report.json
            specs/eval/pr_report.md
