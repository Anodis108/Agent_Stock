# Portfolio Watch V3 — Docker product 1 service (Phase 3)
# Up:   cp .env.example .env   # điền OPENAI_API_KEYS nếu LLM_BACKEND=openai
#       docker compose up --build
# Logs: docker compose logs -f app
# Down: docker compose down
# Data: volume `pw_data` → /app/data (SQLite: portfolio_watch.db + backend_store.db)
# Optional: docker compose --profile qdrant up -d (Qdrant service)

services:
  app:
    build: .
    image: portfolio-watch:split
    container_name: portfolio-watch-app
    env_file:
      - .env
    command:
      [
        "uvicorn",
        "src.portfolio_watch.backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      AI_TRANSPORT: "inprocess"
      # Same-origin product — đè FRONTEND_ORIGIN=:5173 từ .env V2 nếu còn
      FRONTEND_ORIGIN: "*"
      SQLITE_PATH: /app/data/portfolio_watch.db
      BACKEND_SQLITE_PATH: /app/data/backend_store.db
      # Khi bật --profile qdrant, app trong mạng compose gọi service `qdrant`
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: "http://host.docker.internal:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pw_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Optional service for long-term memory (Phase 8) — kích hoạt: docker compose --profile qdrant up -d
  qdrant:
    image: qdrant/qdrant:latest
    container_name: portfolio-watch-qdrant
    profiles:
      - qdrant
      - optional
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  pw_data:
    name: portfolio-watch-data
  qdrant_data:
    name: portfolio-watch-qdrant-data
