# Portfolio Watch — Phase 7 compose: AI + Backend + Frontend (3 service)
# Up:   cp .env.example .env   # điền OPENAI_API_KEYS nếu LLM_BACKEND=openai
#       docker compose up --build
# Logs: docker compose logs -f
#       docker compose logs -f ai
# Down: docker compose down
# Data: volume `pw_data` → /app/data (AI SQLITE + Backend SQLite)

services:
  ai:
    build: .
    image: portfolio-watch:split
    container_name: portfolio-watch-ai
    env_file:
      - .env
    command:
      [
        "uvicorn",
        "src.portfolio_watch.ai_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    ports:
      - "8001:8001"
    environment:
      AI_API_HOST: "0.0.0.0"
      AI_API_PORT: "8001"
      SQLITE_PATH: /app/data/portfolio_watch.db
      LANGFUSE_HOST: "http://host.docker.internal:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pw_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  backend:
    image: portfolio-watch:split
    container_name: portfolio-watch-backend
    env_file:
      - .env
    depends_on:
      - ai
    command:
      ["uvicorn", "src.portfolio_watch.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      # Trong mạng compose: Backend gọi AI qua tên service
      AI_BASE_URL: http://ai:8001
      BACKEND_SQLITE_PATH: /app/data/backend_store.db
      FRONTEND_ORIGIN: "*"
    volumes:
      - pw_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: portfolio-watch:split
    container_name: portfolio-watch-frontend
    depends_on:
      - backend
    command:
      [
        "python",
        "-m",
        "http.server",
        "5173",
        "--bind",
        "0.0.0.0",
        "--directory",
        "src/portfolio_watch/frontend",
      ]
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  pw_data:
    name: portfolio-watch-data
