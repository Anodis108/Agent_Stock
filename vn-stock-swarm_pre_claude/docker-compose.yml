services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - redis-data:/data

  seed-loader:
    build: .
    entrypoint: ["python", "-m", "seed_loader"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  scout:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_TYPE: scout
    depends_on:
      redis:
        condition: service_healthy
      seed-loader:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    deploy:
      replicas: 2
    restart: unless-stopped

  render:
    build:
      context: .
      dockerfile: Dockerfile.render
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_TYPE: render
    depends_on:
      redis:
        condition: service_healthy
      seed-loader:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    restart: unless-stopped

  document:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_TYPE: document
    depends_on:
      redis:
        condition: service_healthy
      seed-loader:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_TYPE: api
    depends_on:
      redis:
        condition: service_healthy
      seed-loader:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    restart: unless-stopped

  stealth:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_TYPE: stealth
    depends_on:
      redis:
        condition: service_healthy
      seed-loader:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    restart: unless-stopped

  query-api:
    build: .
    entrypoint: ["uvicorn", "query.api:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data

volumes:
  redis-data:
