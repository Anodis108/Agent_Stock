# M3-B6 — Eval gate on PR (Module III, Bài 6)
name: Eval Gate

on:
  pull_request:
    paths:
      - "llm-backend-ref-portfolio-watch/resources/prompts/**"
      - "llm-backend-ref-portfolio-watch/src/backend/**"
      - "llm-backend-ref-portfolio-watch/resources/eval/**"
      - ".github/workflows/eval-gate.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: llm-backend-ref-portfolio-watch

jobs:
  eval_gate:
    name: eval-gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      LLM_BACKEND: openai
      LLM_MODEL: gpt-4o-mini
      OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm-backend-ref-portfolio-watch/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Cache eval responses
        uses: actions/cache@v4
        with:
          path: llm-backend-ref-portfolio-watch/.eval_cache
          key: eval-cache-${{ hashFiles('llm-backend-ref-portfolio-watch/resources/prompts/**') }}
          restore-keys: |
            eval-cache-

      - name: Run eval subset
        run: python -m backend.eval.run --subset --skip-agent-eval --json specs/eval/pr_report.json --report specs/eval/pr_report.md

      - name: Run gate
        run: python -m backend.eval.gate --run specs/eval/pr_report.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports-${{ github.run_id }}
          path: |
            llm-backend-ref-portfolio-watch/specs/eval/pr_report.json
            llm-backend-ref-portfolio-watch/specs/eval/pr_report.md

      - name: Comment eval report on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'llm-backend-ref-portfolio-watch/specs/eval/pr_report.md';
            let body = '## Eval Gate Report\n\n_Report file not found._';
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
              if (body.length > 60000) {
                body = body.slice(0, 60000) + '\n\n… _(truncated)_';
              }
            }
            const marker = '<!-- eval-gate-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }
