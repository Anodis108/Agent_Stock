# M3-B6 — CI: prompt lint + unit tests (Module III, Bài 6)
name: CI Pipeline

on:
  pull_request:
    paths:
      - "llm-backend-ref-portfolio-watch/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "llm-backend-ref-portfolio-watch/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: llm-backend-ref-portfolio-watch

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm-backend-ref-portfolio-watch/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Prompt lint
        run: python -m backend.infra.llm.prompt_lint resources/prompts/

      - name: Unit tests
        run: pytest tests/ -q
