name: ci

# Module III, Bài 6, Section 4 — CI Patterns cho LLM.
#
# Nguyên tắc quan trọng nhất của bài: **chạy check RẺ trước, check ĐẮT sau.**
# Prompt lint và ruff mất vài giây; pytest mất chục giây; eval gate (workflow
# riêng) tốn tiền gọi LLM thật. Xếp sai thứ tự nghĩa là mỗi PR lỗi chính tả /
# import vẫn đốt thời gian runner (và nếu lẫn eval vào đây thì đốt tiền API).
#
# Nên: job `checks` (rẻ) chạy xong mới tới job `tests` (needs:). Còn eval gate
# tách hẳn ra eval-gate.yml và chỉ chạy khi PR đụng prompt / ai_backend / eval.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "resources/**"
      - "wheels/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "resources/**"
      - "wheels/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

# PR mới đè lên PR cũ cùng nhánh → huỷ run đang chạy. Không có cái này thì 5 lần
# push liên tiếp = 5 run chạy song song, tốn runner mà kết quả cũ đã vô nghĩa.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI hermetic: không cần API key / tracing ngoài. Fallback & retry do tests/conftest.py.
  PYTHONPATH: src
  MONITORING_ENABLED: "false"

jobs:
  # ── Tầng 1: check rẻ, chạy trước ────────────────────────────────────────────
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install wheels/*.whl
          pip install -r requirements-dev.txt

      - name: Prompt lint (metadata, version, biến template)
        # Không gọi LLM — lint YAML dưới resources/prompts/ trước khi eval/CD.
        run: python -m ai_backend.infra.prompts.lint resources/prompts/

      - name: Ruff (E, F, I, B, UP — trừ E501)
        run: ruff check .

  # ── Tầng 2: test, chỉ chạy khi tầng 1 xanh ──────────────────────────────────
  tests:
    name: tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install wheels/*.whl
          pip install -r requirements-dev.txt

      - name: Pytest
        # Không set OPENAI_API_KEYS: suite kỳ vọng mock / fallback offline.
        # Nếu một test bắt đầu cần key thật, nó sẽ đỏ ở đây — đó là điều ta muốn
        # biết (test lọt ra ngoài ranh giới hermetic).
        run: python -m pytest tests/ -q
