# M3-B6 — CI: prompt lint + unit tests (Module III, Bài 6)
name: CI Pipeline

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "resources/**"
      - "wheels/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "resources/**"
      - "wheels/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      PRICE_FALLBACK_ON_ERROR: "true"
      MONITORING_ENABLED: "false"
      LLM_MAX_RETRIES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install wheels/*.whl
          pip install -e ".[dev]"

      - name: Prompt lint
        run: python -m backend.infra.llm.prompt_lint resources/prompts/

      - name: Unit tests
        run: pytest tests/ -q
