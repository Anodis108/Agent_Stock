# Portfolio Watch V5 — Microservices Deployment (Frontend + Backend)
#
# Khởi động cả 2 container:
#   cp .env.example .env   # Điền OPENAI_API_KEYS nếu dùng OpenAI
#   docker compose up --build -d
#
# Truy cập:
#   Frontend Web UI : http://localhost:3000 (Nginx reverse-proxy)
#   Backend API     : http://localhost:8000 (FastAPI Swagger /docs, /health)
#
# Xem logs:
#   docker compose logs -f
#
# Dừng hệ thống:
#   docker compose down

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: portfolio-watch:backend
    pull_policy: build
    container_name: portfolio-watch-backend
    env_file:
      - .env
    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      AI_TRANSPORT: "inprocess"
      FRONTEND_ORIGIN: "*"
      SQLITE_PATH: /app/data/portfolio_watch.db
      BACKEND_SQLITE_PATH: /app/data/backend_store.db
      MONITORING_ENABLED: "${MONITORING_ENABLED:-false}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${DOCKER_LANGFUSE_HOST:-http://langfuse-web:3000}"
      QDRANT_URL: http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pw_data:/app/data
      - ./resources:/app/resources
      - ./specs:/app/specs
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.env.example:/app/.env.example:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: portfolio-watch:frontend
    pull_policy: build
    container_name: portfolio-watch-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Alias / Utility runner cho test và eval trong container:
  # docker compose run --rm app pytest tests/ -v
  # docker compose run --rm app python -m backend.eval.run_detailed
  app:
    image: portfolio-watch:backend
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: portfolio-watch-app
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      AI_TRANSPORT: "inprocess"
      SQLITE_PATH: /app/data/portfolio_watch.db
      BACKEND_SQLITE_PATH: /app/data/backend_store.db
    volumes:
      - pw_data:/app/data
      - ./resources:/app/resources
      - ./specs:/app/specs
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.env.example:/app/.env.example:ro
    profiles:
      - tools
      - test

  # Service tùy chọn cho Long-term Memory Vector Search (kích hoạt: docker compose --profile qdrant up -d)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: portfolio-watch-qdrant
    profiles:
      - qdrant
      - optional
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  pw_data:
    name: portfolio-watch-data
  qdrant_data:
    name: portfolio-watch-qdrant-data

