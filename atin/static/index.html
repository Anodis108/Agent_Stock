<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent_stat — Thống kê ra/vào khu vực</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 1.3rem; }
  #log { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 90%; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; }
  .bot { align-self: flex-start; background: #1e293b; }
  .sql { font-family: monospace; font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer; }
  .hint { color: #94a3b8; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>agent_stat — Thống kê ra/vào khu vực</h1>
  <p class="hint">VD: "Hôm nay có bao nhiêu lượt vào Khu A?" · "Từ 3h đến 4h chiều có bao nhiêu người vào?"</p>
  <div id="log"></div>
  <form id="ask-form">
    <input id="question" placeholder="Nhập câu hỏi thống kê..." required />
    <button type="submit">Hỏi</button>
  </form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("ask-form");
const input = document.getElementById("question");
const threadId = crypto.randomUUID();

function addMsg(text, cls, sql) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  if (sql) {
    const s = document.createElement("div");
    s.className = "sql";
    s.textContent = sql;
    div.appendChild(s);
  }
  log.appendChild(div);
  div.scrollIntoView({ behavior: "smooth" });
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addMsg(question, "user");
  input.value = "";
  addMsg("Đang xử lý...", "bot");
  const placeholder = log.lastChild;
  try {
    const res = await fetch("/stat/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, thread_id: threadId }),
    });
    const data = await res.json();
    placeholder.remove();
    if (!res.ok) {
      addMsg("Lỗi: " + (data.detail || res.statusText), "bot");
      return;
    }
    addMsg(data.answer, "bot", data.sql);
  } catch (err) {
    placeholder.remove();
    addMsg("Lỗi kết nối: " + err, "bot");
  }
});
</script>
</body>
</html>
