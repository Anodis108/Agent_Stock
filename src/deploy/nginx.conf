# Module III, Bài 5, Section 3 — nginx reverse proxy trước web backend.
#
# File này CHỈ có block `listen 80` (giống llm-engineer-demo/deploy/nginx.conf).
# TLS thường do Cloudflare Tunnel / ngrok chấm dứt phía ngoài — không viết sẵn
# `listen 443 ssl` ở đây (tránh vòng bế tắc certbot nếu sau này cấp cert trên host).
#
# QUAN TRỌNG cho SSE (`/chat`, `/api/`): nginx mặc định BUFFER toàn bộ response
# trước khi trả client → client không thấy token dần. Phải `proxy_buffering off`.
#
# Local: proxy tới 127.0.0.1:8000 (web_backend). AI backend (:8001) không public —
# chỉ web gọi nội bộ / qua compose network.

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
