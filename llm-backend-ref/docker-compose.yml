volumes:
  pgdata:

networks:
  app-tier:
    driver: bridge

# src/ có 3 phần tách biệt (chatbot, be, fe) — mỗi phần là một service riêng,
# build từ Dockerfile của chính nó. be/fe chưa có code nên chưa khai báo ở đây;
# thêm service be/fe (tương tự chatbot bên dưới) khi có Dockerfile thật.
services:
  chatbot:
    build:
      context: .
      dockerfile: src/chatbot/Dockerfile
    ports:
      - "8000:8000"
    networks:
      - app-tier
    volumes:
      - type: bind
        source: ./src/chatbot
        target: /app/src/chatbot
      - type: bind
        source: ./resources
        target: /app/resources
    command: ["uvicorn", "src.chatbot.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      # Dùng chung container Qdrant "legal-qdrant" của llm-engineer-demo (đã có
      # sẵn dữ liệu ingest — collection legal_docs) thay vì tạo instance riêng.
      # Container đó nằm ở compose project khác (network riêng) nhưng expose
      # port 6333 ra host, nên gọi qua host.docker.internal thay vì hostname.
      QDRANT_URL: http://host.docker.internal:6333
      # .env LANGFUSE_HOST=localhost:3000 chỉ đúng khi chạy ngoài Docker.
      # Trong container, localhost là chính nó — Langfuse web nằm trên host.
      LANGFUSE_HOST: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

